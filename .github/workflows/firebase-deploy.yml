name: Publicar no Firebase

on:
  push:
    branches: [main, claude/app-banho-melhorias-bmd5ie]
    paths: ['gatecao.html', 'firebase/**', 'functions/**', 'firebase.json', 'tools/build_firebase.py', '.github/workflows/firebase-deploy.yml']
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - name: Montar o app
        run: python3 tools/build_firebase.py
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Credencial do Firebase
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::Falta o segredo FIREBASE_SERVICE_ACCOUNT no GitHub"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Publicar site e regras do banco
        run: npx --yes firebase-tools@14 deploy --only hosting,firestore:rules --project gatecao-5acbc --non-interactive
      - name: Publicar regras das fotos
        continue-on-error: true
        run: npx --yes firebase-tools@14 deploy --only storage --project gatecao-5acbc --non-interactive
      - name: Ligar a API de cobrança (necessária para o servidor de avisos)
        continue-on-error: true
        run: |
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet
          if ! gcloud services list --enabled --project gatecao-5acbc --format='value(config.name)' | grep -q cloudbilling; then
            gcloud services enable cloudbilling.googleapis.com --project gatecao-5acbc --quiet && sleep 60
          fi
      - name: Guardar a credencial do Mercado Pago (ou placeholder)
        continue-on-error: true
        env:
          MP_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
        run: |
          VAL="${MP_TOKEN:-disabled}"
          printf '%s' "$VAL" | npx --yes firebase-tools@14 functions:secrets:set MP_ACCESS_TOKEN --project gatecao-5acbc --data-file=- || echo "não foi possível definir o segredo (seguindo)"
      - name: Instalar o servidor de avisos
        run: cd functions && npm ci --omit=dev --no-audit --no-fund
      - name: Publicar o servidor de avisos
        run: npx --yes firebase-tools@14 deploy --only functions --project gatecao-5acbc --non-interactive --force
