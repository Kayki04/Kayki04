<title>Gatecão Fidelidade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Layout: balcão de loja. Barra azul-marinho fixa com abas; PDV em duas colunas (cliente + compra | resumo do caixa); demais áreas em listas e fichas. Cores e fontes do app Gatecão. */
:root{
  --bg:#F4F7FC; --surface:#FFFFFF; --sunk:#EEF3FA; --ink:#0B2A5B; --muted:#5E6F8E; --line:#DFE6F1;
  --brand:#0B2A5B; --brand-ink:#FFFFFF; --accent:#FF7A00; --accent-ink:#0B2A5B; --accent-soft:#FFF1E2;
  --good:#1D7F53; --good-soft:#E2F4EA; --warn:#9A5B00; --warn-soft:#FFF3D6; --bad:#B8392A; --bad-soft:#FCE9E5; --chip:#E4EEFF;
  --font-display:'Fredoka','Trebuchet MS',sans-serif; --font-body:'Nunito Sans','Segoe UI',system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08111F; --surface:#0F1C33; --sunk:#0B1629; --ink:#E7EEFA; --muted:#9AAACB; --line:#203152;
  --brand:#0B2A5B; --brand-ink:#FFFFFF; --accent:#FF8A1F; --accent-ink:#1A0E00; --accent-soft:#3A230C;
  --good:#5BD19A; --good-soft:#0F2E20; --warn:#F2B44C; --warn-soft:#33270B; --bad:#FF8676; --bad-soft:#3A1611; --chip:#1A2B4C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08111F; --surface:#0F1C33; --sunk:#0B1629; --ink:#E7EEFA; --muted:#9AAACB; --line:#203152;
  --brand:#0B2A5B; --brand-ink:#FFFFFF; --accent:#FF8A1F; --accent-ink:#1A0E00; --accent-soft:#3A230C;
  --good:#5BD19A; --good-soft:#0F2E20; --warn:#F2B44C; --warn-soft:#33270B; --bad:#FF8676; --bad-soft:#3A1611; --chip:#1A2B4C; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;padding-bottom:80px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;font-weight:600}
h2{font-size:20px} h3{font-size:16px}
.num,td.n,.money{font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 4px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:22px;font-weight:700}
.logo svg{width:30px;height:30px;color:#FF8A1F;flex:none}
.logo small{display:block;font-family:var(--font-body);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.75;margin-top:-3px}
.sync{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.12);display:flex;gap:6px;align-items:center}
.sync i{width:8px;height:8px;border-radius:50%;background:#9AAACB}
.sync.ok i{background:#5BD19A}.sync.warn i{background:#F2B44C}.sync.err i{background:#FF8676}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{color:var(--brand-ink);text-decoration:none;font-weight:800;font-size:14px;padding:10px 14px;border-radius:12px 12px 0 0;opacity:.8;white-space:nowrap}
nav.tabs a[aria-current="page"]{background:var(--bg);color:var(--ink);opacity:1}
main{padding-block:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.col{display:grid;gap:18px;min-width:0}
@media (max-width:880px){.grid2{grid-template-columns:minmax(0,1fr)}}
.sticky{position:sticky;top:120px}
@media (max-width:880px){.sticky{position:static}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:13px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
label.f{display:grid;gap:5px;font-size:13px;font-weight:700;color:var(--muted);min-width:0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=number],input[type=search],select,textarea{
  width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);min-width:0}
textarea{resize:vertical;min-height:90px;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.big-in{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;padding:12px 14px}
.btn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;font-weight:800;font-size:14px;display:inline-flex;gap:6px;align-items:center;justify-content:center;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.wa{background:#1FA855;border-color:#1FA855;color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.ghost{border-color:transparent;background:transparent;padding-inline:8px}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn.xl{padding:15px 18px;font-size:17px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:800;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--ink);white-space:nowrap}
.lv-Bronze,.lv-0{background:#F3E1CF;color:#6E3B12}
.lv-Prata,.lv-1{background:#E3E8EF;color:#3B4A60}
.lv-Ouro,.lv-2{background:#FFE7A0;color:#6A4A00}
:root[data-theme="dark"] .lv-0{background:#3B2715;color:#F3C9A0}
:root[data-theme="dark"] .lv-1{background:#26324A;color:#D2DCEB}
:root[data-theme="dark"] .lv-2{background:#3D3110;color:#FFD866}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lv-0{background:#3B2715;color:#F3C9A0}:root:not([data-theme="light"]) .lv-1{background:#26324A;color:#D2DCEB}:root:not([data-theme="light"]) .lv-2{background:#3D3110;color:#FFD866}}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.note{border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}
.note.warn{background:var(--warn-soft);color:var(--warn)} .note.good{background:var(--good-soft);color:var(--good)} .note.info{background:var(--sunk);color:var(--muted)}
.wallet{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wallet>div{background:var(--sunk);border-radius:12px;padding:12px 14px;display:grid;gap:2px}
.wallet b{font-family:var(--font-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.wallet .cb b{color:var(--good)} .wallet .pt b{color:var(--accent)}
:root .wallet .pt b{color:var(--warn)}
.who{display:flex;gap:12px;align-items:center;min-width:0}
.av{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:18px;flex:none}
.who .nm{font-weight:800;font-size:17px;overflow-wrap:anywhere}
.results{display:grid;gap:6px}
.res{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.res:hover{border-color:var(--accent)}
.res .r{text-align:right;font-size:13px;font-variant-numeric:tabular-nums}
.sum{display:grid;gap:8px}
.sum .l{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.sum .tot{border-top:2px dashed var(--line);padding-top:12px;margin-top:4px;align-items:baseline}
.sum .tot b{font-family:var(--font-display);font-size:34px;font-weight:600}
.earn{background:var(--good-soft);color:var(--good);border-radius:12px;padding:12px 14px;font-weight:700;display:grid;gap:2px}
.earn b{font-size:18px}
.prizes{display:grid;gap:8px}
.prize{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--sunk)}
.prize .p{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
.pos{color:var(--good);font-weight:700} .neg{color:var(--bad);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:4px}
.kpi b{font-family:var(--font-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi.hl{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.kpi.hl .eyebrow{color:var(--brand-ink);opacity:.75}
.segs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.segc{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;display:grid;gap:4px}
.segc b{font-family:var(--font-display);font-size:26px;font-weight:600}
.segc[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.list{display:grid;gap:8px}
.item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);flex-wrap:wrap}
.item .t{min-width:0;flex:1 1 200px}
.tpl{display:grid;gap:8px;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface)}
.tpl p{margin:0;white-space:pre-wrap;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.vars{display:flex;gap:6px;flex-wrap:wrap}
.vars button{border:1px dashed var(--line);background:var(--sunk);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:700;font-family:ui-monospace,Menlo,monospace}
.bubble{background:#DCF8C6;color:#102A14;border-radius:12px 12px 2px 12px;padding:12px 14px;white-space:pre-wrap;font-size:14px;max-width:100%;overflow-wrap:anywhere}
:root[data-theme="dark"] .bubble{background:#1E4D2B;color:#E6F6EA}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bubble{background:#1E4D2B;color:#E6F6EA}}
.hist-note{font-size:13px;padding:8px 10px;border-radius:8px;background:var(--sunk)}
.empty{text-align:center;padding:28px 16px;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty b{color:var(--ink);font-size:16px}
.ok-ico{width:52px;height:52px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center}
.ok-ico svg{width:28px;height:28px}
#modal{position:fixed;inset:0;z-index:20;background:rgba(5,12,25,.55);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#modal .box{background:var(--surface);border-radius:16px;max-width:560px;width:100%;max-height:100%;overflow:auto;padding:20px;display:grid;gap:14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.25)}
#toast.err{background:var(--bad);color:#fff}
hr{border:0;border-top:1px solid var(--line);margin:0;width:100%}
.lvtbl input{padding:7px 9px}
@media (prefers-reduced-motion:no-preference){.btn,.res,.segc{transition:border-color .15s,background .15s}}
</style>

<header class="top">
  <div class="wrap">
    <div class="toprow">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5.5" cy="9" r="2.2"/><circle cx="9.5" cy="5" r="2.2"/><circle cx="14.5" cy="5" r="2.2"/><circle cx="18.5" cy="9" r="2.2"/><path d="M12 10.5c-3.2 0-6.5 4.3-6.5 7.2 0 1.8 1.4 2.8 3 2.8 1.3 0 2.2-.7 3.5-.7s2.2.7 3.5.7c1.6 0 3-1 3-2.8 0-2.9-3.3-7.2-6.5-7.2z"/></svg>
        <div><span id="loja-nome">Gatecão</span><small>Fidelidade · PDV · CRM</small></div>
      </div>
      <div id="sync" class="sync"><i></i><span>Conectando…</span></div>
    </div>
    <nav class="tabs" id="tabs">
      <a href="#pdv" data-tab="pdv">Caixa (PDV)</a>
      <a href="#clientes" data-tab="clientes">Clientes</a>
      <a href="#crm" data-tab="crm">CRM</a>
      <a href="#premios" data-tab="premios">Prêmios</a>
      <a href="#mensagens" data-tab="mensagens">Mensagens</a>
      <a href="#ajustes" data-tab="ajustes">Ajustes</a>
    </nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div id="modal" hidden></div>
<div id="toast" hidden></div>

<script>
/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BRL = new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL'});
const money = v => BRL.format(+v || 0);
const r2 = v => Math.round((+v || 0) * 100) / 100;
const parseMoney = s => { s = String(s ?? '').replace(/[^\d,.-]/g, ''); if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); const n = parseFloat(s); return isFinite(n) && n > 0 ? r2(n) : 0; };
const moneyIn = v => v ? String(r2(v).toFixed(2)).replace('.', ',') : '';
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const DAY = 864e5;
const dayKey = d => new Date(d).toLocaleDateString('sv');
const fmtDate = d => d ? new Date(d).toLocaleDateString('pt-BR') : '—';
const fmtDT = d => new Date(d).toLocaleString('pt-BR', {dateStyle:'short', timeStyle:'short'});
const digits = s => String(s || '').replace(/\D/g, '');
const fmtPhone = s => { const d = digits(s); if (d.length === 11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`; if (d.length === 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`; return s || ''; };
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const initials = n => String(n || '?').trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase();
const firstName = n => String(n || '').trim().split(/\s+/)[0] || '';
const plural = (n, a, b) => `${n.toLocaleString('pt-BR')} ${n === 1 ? a : b}`;
const clone = o => JSON.parse(JSON.stringify(o));
const daysAgo = d => d ? Math.floor((Date.now() - Date.parse(d)) / DAY) : null;
const icoCheck = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

/* ---------- padrões ---------- */
const DEFAULT_CFG = {
  loja: 'Gatecão', ptsPorReal: 1, maxUsoPct: 100, validadeDias: 90,
  niveis: [{nome:'Bronze', min:0, cb:5}, {nome:'Prata', min:1000, cb:7}, {nome:'Ouro', min:3000, cb:10}]
};
const DEFAULT_MSGS = [
  {gatilho:'boas-vindas', titulo:'Boas-vindas ao clube', texto:'Oi {primeiro_nome}! Que bom ter você no clube de vantagens da {loja} 🐾\n\nA cada compra você ganha {cashback_pct} de cashback e pontos para trocar por prêmios. Seu saldo hoje: {cashback} de cashback e {pontos} pontos.'},
  {gatilho:'pos-compra', titulo:'Comprovante pós-compra', texto:'Oi {primeiro_nome}, obrigado pela compra na {loja}!\n\nValor pago: {valor_compra}\nCashback ganho: {cashback_ganho}\nPontos ganhos: {pontos_ganhos}\n\nSeu saldo agora: {cashback} de cashback e {pontos} pontos. Use na próxima compra!'},
  {gatilho:'vencendo', titulo:'Cashback vencendo', texto:'{primeiro_nome}, atenção: você tem {cashback_vencendo} de cashback que vence em {data_vencimento}.\n\nPasse na {loja} e use como desconto na sua compra antes que expire!'},
  {gatilho:'inativo', titulo:'Sentimos sua falta', texto:'Oi {primeiro_nome}, sentimos sua falta aqui na {loja}! 💛\n\nVocê ainda tem {cashback} de cashback e {pontos} pontos esperando por você. Que tal aproveitar esta semana?'},
  {gatilho:'aniversario', titulo:'Feliz aniversário', texto:'Feliz aniversário, {primeiro_nome}! 🎉\n\nToda a equipe {loja} deseja um dia incrível. Venha comemorar com a gente: seu cashback de {cashback} está te esperando.'},
  {gatilho:'pontos', titulo:'Pontos para trocar', texto:'{primeiro_nome}, você já tem {pontos} pontos na {loja}!\n\nDá para trocar por {premio_sugerido}. É só pedir no caixa na sua próxima visita.'},
  {gatilho:'nivel', titulo:'Subiu de nível', texto:'Parabéns, {primeiro_nome}! Você agora é cliente {nivel} na {loja} e passa a ganhar {cashback_pct} de cashback em todas as compras. Obrigado pela confiança!'},
  {gatilho:'livre', titulo:'Promoção da semana', texto:'Oi {primeiro_nome}! Esta semana tem condição especial na {loja}.\n\nE lembrando: você tem {cashback} de cashback para usar como desconto. Te esperamos!'}
];
const DEFAULT_PREMIOS = [
  {nome:'Petisco natural', pontos:100, estoque:'', descricao:'Exemplo: edite ou exclua'},
  {nome:'Brinquedo', pontos:250, estoque:'', descricao:'Exemplo: edite ou exclua'},
  {nome:'Vale R$ 20 em compras', pontos:300, estoque:'', descricao:'Exemplo: edite ou exclua'},
  {nome:'Banho grátis (porte P)', pontos:400, estoque:'', descricao:'Exemplo: edite ou exclua'}
];
const GATILHOS = {'boas-vindas':'Boas-vindas', 'pos-compra':'Pós-compra', 'vencendo':'Cashback vencendo', 'inativo':'Cliente sumido', 'aniversario':'Aniversário', 'pontos':'Pontos para troca', 'nivel':'Mudança de nível', 'livre':'Livre / promoção'};
const FORMAS = {pix:'Pix', dinheiro:'Dinheiro', debito:'Débito', credito:'Crédito', outro:'Outro'};

/* ---------- estado ---------- */
const S = {clientes:new Map(), premios:new Map(), mensagens:new Map(), avulsas:new Map(), config:null};
let mode = 'connecting', db = null, statCache = new Map(), pendingRender = false;
let tab = 'pdv', confirmKey = null;
const pdv = {clienteId:null, avulsa:false, busca:'', valor:'', desconto:'', usarCb:'', forma:'pix', recebido:'', descricao:'', novo:false, resultado:null, resgate:null};

/* ---------- saldos (calculados do histórico) ---------- */
function nivelPor(gasto) {
  const nv = [...cfg().niveis].map((n, i) => ({...n, idx:i})).sort((a, b) => b.min - a.min);
  return nv.find(n => gasto >= n.min) || nv[nv.length - 1];
}
function stats(c) {
  if (statCache.has(c.id)) return statCache.get(c.id);
  const v = +cfg().validadeDias || 0, now = Date.now();
  const movs = [...(c.mov || [])].sort((a, b) => a.data < b.data ? -1 : 1);
  const lots = []; let pts = 0, gasto12 = 0, gastoTot = 0, compras = 0, ultima = null, cbTot = 0;
  for (const m of movs) {
    const t = Date.parse(m.data);
    if (m.cbUsado > 0) { let r = m.cbUsado; for (const l of lots) { if (l.exp && l.exp < t) continue; const u = Math.min(l.rest, r); l.rest = r2(l.rest - u); r = r2(r - u); if (r <= 0) break; } }
    if (m.cbGerado > 0) { lots.push({rest:m.cbGerado, exp: v ? t + v * DAY : 0}); cbTot += m.cbGerado; }
    pts += (m.pts || 0) - (m.ptsUsados || 0);
    if (m.t === 'compra') { gastoTot += m.pago; compras++; ultima = m.data; if (now - t < 365 * DAY) gasto12 += m.pago; }
  }
  const ativos = lots.filter(l => l.rest > 0.004 && (!l.exp || l.exp > now));
  const saldo = r2(ativos.reduce((s, l) => s + l.rest, 0));
  const venc = ativos.filter(l => l.exp && l.exp - now <= 7 * DAY);
  const s = {saldo, pts:Math.max(0, pts), gasto12:r2(gasto12), gastoTot:r2(gastoTot), compras, ultima, cbTot:r2(cbTot),
    ticket: compras ? r2(gastoTot / compras) : 0, nivel: nivelPor(gasto12),
    vencendo: r2(venc.reduce((s, l) => s + l.rest, 0)), vencData: venc.length ? Math.min(...venc.map(l => l.exp)) : null};
  statCache.set(c.id, s); return s;
}

/* ---------- armazenamento ---------- */
const LS_KEY = 'gatecao-fidelidade-v1';
function saveLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({clientes:[...S.clientes.values()], premios:[...S.premios.values()], mensagens:[...S.mensagens.values()], avulsas:[...S.avulsas.values()], config:S.config})); }
  catch (e) { toast('Não foi possível salvar neste navegador.', true); }
}
function startLocal(motivo) {
  mode = 'local';
  let data = null; try { data = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) {}
  if (!data) {
    data = {clientes:[], avulsas:[], config:{...DEFAULT_CFG},
      premios: DEFAULT_PREMIOS.map(p => ({...p, id:newId()})),
      mensagens: DEFAULT_MSGS.map((m, i) => ({...m, ordem:i, id:newId()}))};
  }
  for (const k of ['clientes', 'premios', 'mensagens', 'avulsas']) S[k] = new Map((data[k] || []).map(d => [d.id, d]));
  S.config = data.config || {...DEFAULT_CFG};
  setSync('warn', motivo || 'Salvo neste navegador');
  saveLocal(); changed();
}
function startDb() {
  mode = 'db';
  let pending = new Set(['clientes', 'premios', 'mensagens', 'avulsas', 'config']);
  const timer = setTimeout(() => { if (pending.size) setSync('warn', 'Sem resposta do banco ainda'); }, 10000);
  const done = (k, snap) => { if (!snap.metadata.fromCache) { pending.delete(k); if (!pending.size) { clearTimeout(timer); setSync('ok', 'Salvo na nuvem'); } } };
  const onErr = e => { clearTimeout(timer); setSync('err', e && e.code === 'revoked' ? 'Acesso aos dados encerrado' : 'Erro ao ler os dados'); };
  for (const col of ['clientes', 'premios', 'mensagens', 'avulsas']) {
    db.collection(col).onSnapshot(snap => {
      S[col] = new Map(snap.docs.map(d => [d.id, {...clone(d.data()), id:d.id}]));
      done(col, snap); changed(true);
    }, onErr);
  }
  db.doc('config/geral').onSnapshot(snap => { S.config = snap.exists ? clone(snap.data()) : null; done('config', snap); changed(true); }, onErr);
}
async function put(col, id, data) {
  const body = {...data}; delete body.id;
  if (col === 'config') S.config = body; else S[col].set(id, {...body, id});
  changed();
  if (mode === 'local') { saveLocal(); return true; }
  try { await (col === 'config' ? db.doc('config/geral') : db.collection(col).doc(id)).set(body); return true; }
  catch (e) { toast(e && e.code === 'quota_exceeded' ? 'Limite de armazenamento atingido. Exporte um backup e exclua registros antigos.' : 'Não foi possível salvar: ' + (e && e.message || 'erro'), true); return false; }
}
async function del(col, id) {
  S[col].delete(id); changed();
  if (mode === 'local') { saveLocal(); return; }
  try { await db.collection(col).doc(id).delete(); } catch (e) { toast('Não foi possível excluir: ' + (e && e.message || 'erro'), true); }
}
function setSync(kind, text) { const el = $('#sync'); el.className = 'sync ' + kind; el.querySelector('span').textContent = text; }
function changed(fromSnapshot) {
  statCache = new Map();
  $('#loja-nome').textContent = cfg().loja || 'Gatecão';
  if (fromSnapshot) requestRender(); else render();
}
function requestRender() {
  const a = document.activeElement;
  if ((a && a.matches('input,textarea,select') && $('#main').contains(a)) || !$('#modal').hidden) { pendingRender = true; return; }
  render();
}

/* ---------- toast / modal ---------- */
let toastT;
function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, err ? 6000 : 3000); }
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('Texto copiado'); }
  catch (e) { const ta = $('#msg-text') || $('#bk-text'); if (ta) { ta.focus(); ta.select(); } toast('Selecione o texto e copie com Ctrl+C', true); }
}

/* ---------- mensagens: variáveis ---------- */
const VARS = ['nome', 'primeiro_nome', 'loja', 'cashback', 'pontos', 'nivel', 'cashback_pct', 'cashback_vencendo', 'data_vencimento', 'ultima_compra', 'premio_sugerido', 'valor_compra', 'cashback_ganho', 'pontos_ganhos'];
function varsFor(c, extra = {}) {
  const s = c ? stats(c) : null, ps = premios();
  const pode = s ? ps.filter(p => p.pontos <= s.pts) : [];
  const sug = pode.length ? pode[pode.length - 1].nome : (ps[0] ? ps[0].nome : 'prêmios');
  return {
    nome: c ? c.nome : '', primeiro_nome: c ? firstName(c.nome) : '', loja: cfg().loja,
    cashback: money(s ? s.saldo : 0), pontos: s ? s.pts.toLocaleString('pt-BR') : '0',
    nivel: s ? s.nivel.nome : '', cashback_pct: (s ? s.nivel.cb : cfg().niveis[0].cb) + '%',
    cashback_vencendo: money(s ? s.vencendo : 0), data_vencimento: s && s.vencData ? fmtDate(s.vencData) : '—',
    ultima_compra: s && s.ultima ? fmtDate(s.ultima) : '—', premio_sugerido: sug,
    valor_compra: money(extra.pago || 0), cashback_ganho: money(extra.cbGerado || 0), pontos_ganhos: String(extra.pts || 0), ...extra.vars
  };
}
const fill = (text, c, extra) => { const v = varsFor(c, extra); return String(text || '').replace(/\{(\w+)\}/g, (m, k) => k in v ? v[k] : m); };
function waLink(phone, text) { let d = digits(phone); if (d && d.length <= 11) d = '55' + d; return `https://wa.me/${d}?text=${encodeURIComponent(text)}`; }
const tplByGatilho = g => mensagens().find(m => m.gatilho === g) || mensagens()[0];

function openMsg(cid, tplId, extra) {

  const tpl = S.mensagens.get(tplId) || mensagens()[0];

}
function renderModal() {
  const m = $('#modal');
  if (!modal) { m.hidden = true; m.innerHTML = ''; if (pendingRender) { pendingRender = false; render(); } return; }
  const c = S.clientes.get(modal.cid);

    <label class="f">Modelo<select id="msg-tpl">${mensagens().map(t => `<option value="${t.id}" ${t.id === modal.tplId ? 'selected' : ''}>${esc(t.titulo)}</option>`).join('')}</select></label>

    <div class="small muted">Para: <b>${esc(c.nome)}</b> · ${c.telefone ? esc(fmtPhone(c.telefone)) : 'sem telefone'}</div>
    <div class="row">

/* ---------- render ---------- */
function render() {
  pendingRender = false;
  document.querySelectorAll('#tabs a').forEach(a => a.dataset.tab === tab ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  const v = {pdv:viewPdv, clientes:viewClientes, crm:viewCrm, premios:viewPremios, mensagens:viewMensagens, ajustes:viewAjustes}[tab];
  $('#main').innerHTML = mode === 'connecting' ? `<div class="card empty"><b>Carregando seus dados…</b><span>Conectando ao banco de dados da loja.</span></div>` : v();
  if (tab === 'pdv') renderResumo();
}
function confirmBtn(key, label, act, data = '', cls = 'btn sm danger') {
  if (confirmKey === key) return `<span class="row" style="gap:6px"><span class="small"><b>Confirmar?</b></span><button class="btn sm danger" data-act="${act}" ${data}>Sim, ${esc(label.toLowerCase())}</button><button class="btn sm" data-act="ask" data-key="">Não</button></span>`;
  return `<button class="${cls}" data-act="ask" data-key="${esc(key)}">${esc(label)}</button>`;
}
const lvChip = n => `<span class="chip lv-${n.idx}">${esc(n.nome)}</span>`;

/* ---------- PDV ---------- */
function calc() {
  const c = pdv.clienteId ? S.clientes.get(pdv.clienteId) : null, s = c ? stats(c) : null, conf = cfg();
  const valor = parseMoney(pdv.valor), desconto = Math.min(parseMoney(pdv.desconto), valor), base = r2(valor - desconto);
  const maxCb = s ? r2(Math.min(s.saldo, base * (+conf.maxUsoPct || 0) / 100)) : 0;
  const pedido = parseMoney(pdv.usarCb), usar = Math.min(pedido, maxCb);
  const total = r2(base - usar), pct = s ? s.nivel.cb : 0;
  const cbGanho = c ? r2(total * pct / 100) : 0, pts = c ? Math.floor(total * (+conf.ptsPorReal || 0)) : 0;
  const recebido = parseMoney(pdv.recebido), troco = pdv.forma === 'dinheiro' && recebido ? r2(recebido - total) : null;
  return {c, s, valor, desconto, base, maxCb, pedido, usar, total, pct, cbGanho, pts, recebido, troco};
}
function clienteForm(c, form, submitLabel) {

    <div class="fields">
      <label class="f">Nome completo *<input type="text" name="nome" id="${form}-nome" required value="${esc(c.nome)}" autocomplete="off"></label>
      <label class="f">Telefone / WhatsApp *<input type="tel" name="telefone" id="${form}-tel" required value="${esc(fmtPhone(c.telefone))}" placeholder="(11) 98765-4321"></label>

      <label class="f">Etiquetas (separe por vírgula)<input type="text" name="tags" id="${form}-tags" value="${esc((c.tags || []).join(', '))}" placeholder="ex.: tutor de gato, VIP"></label>
    </div>

    <div class="row"><button class="btn pri">${esc(submitLabel)}</button><button type="button" class="btn ghost" data-act="${form}-cancel">Cancelar</button></div>
  </form>`;
}

function pdvResults() {
  const q = norm(pdv.busca).trim(), qd = digits(pdv.busca);
  let list = clientes();
  if (!list.length) return `<div class="note info">Nenhum cliente cadastrado ainda. Cadastre o primeiro no botão abaixo.</div>`;
  if (q) list = list.filter(c => norm(c.nome).includes(q) || (qd.length >= 3 && (digits(c.telefone).includes(qd) || digits(c.cpf).includes(qd))));
  else list = list.sort((a, b) => String(stats(b).ultima || b.criadoEm).localeCompare(String(stats(a).ultima || a.criadoEm))).slice(0, 5);
  if (!list.length) return `<div class="note info">Nenhum cliente encontrado para “${esc(pdv.busca)}”.</div>`;
  return (q ? '' : '<div class="eyebrow">Atendidos recentemente</div>') + list.slice(0, 8).map(c => { const s = stats(c); return `<button class="res" data-act="pdv-sel" data-c="${c.id}"><span><b>${esc(c.nome)}</b><br><span class="small muted">${esc(fmtPhone(c.telefone))}</span></span><span class="r"><span class="pos">${money(s.saldo)}</span><br><span class="muted">${s.pts.toLocaleString('pt-BR')} pts</span></span></button>`; }).join('');
}

async function finalizar() {

  const now = new Date().toISOString();
  if (k.c) {

    const m = {id:newId(), t:'compra', data:now, valor:k.valor, desconto:k.desconto, cbUsado:k.usar, cbGerado:k.cbGanho, pts:k.pts, ptsUsados:0, pago:k.total, forma:pdv.forma, desc:pdv.descricao.trim(), pct:k.pct};
    c.mov = [...(c.mov || []), m];
    if (!await put('clientes', c.id, c)) return;
    const depois = stats(S.clientes.get(c.id)).nivel.nome;
    pdv.resultado = {...m, tipo:'compra', cid:c.id, troco:k.troco > 0 ? k.troco : 0, subiu: depois !== antes && stats(S.clientes.get(c.id)).nivel.min > 0};
  } else {
    const mes = now.slice(0, 7), doc = clone(S.avulsas.get(mes) || {vendas:[]});
    const m = {id:newId(), data:now, valor:k.valor, desconto:k.desconto, pago:k.total, forma:pdv.forma, desc:pdv.descricao.trim()};
    doc.vendas = [...(doc.vendas || []), m];
    if (!await put('avulsas', mes, doc)) return;
    pdv.resultado = {...m, tipo:'compra', cid:null, cbUsado:0, troco:k.troco > 0 ? k.troco : 0};
  }
  Object.assign(pdv, {valor:'', desconto:'', usarCb:'', recebido:'', descricao:''});

}
async function resgatar(pid) {

}

function backupJson() {
  return JSON.stringify({app:'gatecao-fidelidade', versao:1, exportadoEm:new Date().toISOString(), config:S.config || DEFAULT_CFG,
    clientes:clientes(), premios:[...S.premios.values()], mensagens:[...S.mensagens.values()], avulsas:[...S.avulsas.values()]});
}
async function importar(txt) {
  let d; try { d = JSON.parse(txt); } catch (e) { return toast('Texto de backup inválido', true); }
  if (!d || d.app !== 'gatecao-fidelidade') return toast('Esse texto não é um backup deste sistema', true);
  toast('Restaurando…');
  for (const col of ['clientes', 'premios', 'mensagens', 'avulsas']) {
    const novos = new Set((d[col] || []).map(x => x.id));
    for (const id of [...S[col].keys()]) if (!novos.has(id)) await del(col, id);
    for (const x of (d[col] || [])) await put(col, x.id, x);
  }
  if (d.config) await put('config', 'geral', d.config);
  ui.importTxt = ''; confirmKey = null; toast('Backup restaurado'); render();
}

    const txt = backupJson(), name = `backup-fidelidade-${dayKey(Date.now())}.json`;
    let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) {}
    if (dl) { try { await dl.save({filename:name, data:txt}); } catch (e) { toast('Download não concluído. Use “Gerar backup” e copie o texto.', true); } return; }
    if (mode === 'local' && !(window.claude && window.claude.use)) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], {type:'application/json'})); a.download = name; a.click(); return; }
    toast('Download indisponível aqui. Use “Gerar backup” e copie o texto.', true);
  },
  'bk-import': () => importar($('#bk-text').value)
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.id === 'modal') return;
  const f = A[el.dataset.act]; if (f) { if (el.tagName !== 'A') e.preventDefault(); f(el); }
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') { modal = null; renderModal(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal) { modal = null; renderModal(); } if (e.key === 'Enter' && e.target.matches('#pdv-valor,#pdv-desc,#pdv-cb,#pdv-rec') && calc().valor > 0) { e.preventDefault(); finalizar(); } });
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.bind) { pdv[el.dataset.bind] = el.value; if (el.dataset.bind === 'busca') $('#pdv-res').innerHTML = pdvResults(); else renderResumo(); }
  else if (el.dataset.bindUi === 'cliBusca') { ui.cliBusca = el.value; const pos = el.selectionStart; render(); const n = $('#cli-busca'); n.focus(); n.setSelectionRange(pos, pos); }
  else if (el.id === 'msg-text' && modal) { modal.text = el.value; $('#msg-wa').href = waLink(S.clientes.get(modal.cid).telefone, el.value); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'msg-tpl' && modal) { const t = S.mensagens.get(el.value); modal.tplId = el.value; modal.text = fill(t.texto, S.clientes.get(modal.cid), modal.extra); renderModal(); }
  else if (el.id === 'envio-seg') { ui.envioSeg = el.value; ui.envioTpl = null; render(); }
  else if (el.id === 'envio-tpl') { ui.envioTpl = el.value; render(); }
  else if (el.id === 'bk-file' && el.files[0]) { const r = new FileReader(); r.onload = () => { ui.importTxt = String(r.result); confirmKey = 'bk-imp'; render(); toast('Arquivo carregado. Confira e confirme a restauração.'); }; r.readAsText(el.files[0]); }
});
document.addEventListener('focusout', () => setTimeout(() => { if (pendingRender && !document.activeElement.matches('input,textarea,select')) render(); }, 150));
document.addEventListener('submit', async e => {
  e.preventDefault(); const f = e.target, fd = new FormData(f), k = f.dataset.form;
  if (k === 'pdvnovo') { const c = readClienteForm(f); if (!c) return; if (await put('clientes', c.id, c)) { Object.assign(pdv, {clienteId:c.id, novo:false, busca:''}); toast('Cliente cadastrado'); render(); } }
  else if (k === 'clinovo') { const c = readClienteForm(f); if (!c) return; if (await put('clientes', c.id, c)) { ui.editando = false; ui.cliSel = c.id; toast('Cliente cadastrado'); render(); } }
  else if (k === 'cliedit') { const c = readClienteForm(f, S.clientes.get(ui.cliSel)); if (!c) return; if (await put('clientes', c.id, c)) { ui.editando = false; toast('Dados salvos'); render(); } }
  else if (k === 'ajuste') {
    const c = clone(S.clientes.get(ui.cliSel)), q = fd.get('tipo') === 'cb' ? parseMoney(fd.get('qtd')) : Math.round(parseMoney(fd.get('qtd'))), add = fd.get('op') === '+';
    if (!q) return toast('Informe a quantidade', true);
    const m = {id:newId(), t:'ajuste', data:new Date().toISOString(), desc:String(fd.get('motivo')).trim()};
    if (fd.get('tipo') === 'cb') add ? m.cbGerado = q : m.cbUsado = Math.min(q, stats(c).saldo); else add ? m.pts = q : m.ptsUsados = Math.min(q, stats(c).pts);
    c.mov = [...(c.mov || []), m]; ui.ajuste = false; await put('clientes', c.id, c); toast('Saldo ajustado');
  }
  else if (k === 'proximo') { const c = clone(S.clientes.get(ui.cliSel)); if (!fd.get('data')) return toast('Escolha a data do contato', true); c.proximo = {data:fd.get('data'), assunto:String(fd.get('assunto')).trim()}; await put('clientes', c.id, c); toast('Contato agendado'); }
  else if (k === 'nota') { const txt = String(fd.get('texto')).trim(); if (!txt) return; const c = clone(S.clientes.get(ui.cliSel)); c.notas = [...(c.notas || []), {id:newId(), data:new Date().toISOString(), tipo:'nota', texto:txt}]; await put('clientes', c.id, c); }
  else if (k === 'premio') { const id = ui.premioEdit === 'novo' ? newId() : ui.premioEdit, pts = Math.round(+fd.get('pontos'));
    if (!String(fd.get('nome')).trim() || !(pts > 0)) return toast('Informe nome e custo em pontos', true);
    const est = String(fd.get('estoque')).trim();
    ui.premioEdit = null; await put('premios', id, {nome:String(fd.get('nome')).trim(), pontos:pts, estoque: est === '' ? '' : Math.max(0, Math.round(+est)), descricao:String(fd.get('descricao')).trim()}); toast('Prêmio salvo'); }
  else if (k === 'tpl') { const id = ui.tplSel === 'novo' ? newId() : ui.tplSel, old = S.mensagens.get(id) || {};
    ui.tplSel = null; await put('mensagens', id, {...old, titulo:String(fd.get('titulo')).trim(), gatilho:fd.get('gatilho'), texto:String(fd.get('texto')), ordem: old.ordem ?? 50}); toast('Modelo salvo'); }
  else if (k === 'cfg') {
    const n = cfg().niveis.map((x, i) => ({nome:String(fd.get(`nv${i}nome`)).trim() || x.nome, min: i === 0 ? 0 : Math.max(0, +fd.get(`nv${i}min`) || 0), cb: Math.max(0, Math.min(100, +fd.get(`nv${i}cb`) || 0))}));
    await put('config', 'geral', {loja:String(fd.get('loja')).trim() || 'Gatecão', ptsPorReal:Math.max(0, +fd.get('ptsPorReal') || 0), validadeDias:Math.max(0, Math.round(+fd.get('validadeDias') || 0)), maxUsoPct:Math.max(0, Math.min(100, +fd.get('maxUsoPct') || 0)), niveis:n});
    toast('Regras salvas');
  }
});
