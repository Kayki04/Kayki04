<title>Gatecão Fidelidade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Layout: balcão de loja. Barra azul-marinho fixa com abas; PDV em duas colunas (cliente + compra | resumo do caixa); demais áreas em listas e fichas. Cores e fontes do app Gatecão. */
:root{
  --bg:#F4F7FC; --surface:#FFFFFF; --sunk:#EEF3FA; --ink:#0B2A5B; --muted:#5E6F8E; --line:#DFE6F1;
  --brand:#0B2A5B; --brand-ink:#FFFFFF; --accent:#FF7A00; --accent-ink:#0B2A5B; --accent-soft:#FFF1E2;
  --good:#1D7F53; --good-soft:#E2F4EA; --warn:#9A5B00; --warn-soft:#FFF3D6; --bad:#B8392A; --bad-soft:#FCE9E5; --chip:#E4EEFF;
  --bar:#2F6BD8; --grid:#E6ECF5;
  --font-display:'Fredoka','Trebuchet MS',sans-serif; --font-body:'Nunito Sans','Segoe UI',system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08111F; --surface:#0F1C33; --sunk:#0B1629; --ink:#E7EEFA; --muted:#9AAACB; --line:#203152;
  --brand:#0B2A5B; --brand-ink:#FFFFFF; --accent:#FF8A1F; --accent-ink:#1A0E00; --accent-soft:#3A230C;
  --good:#5BD19A; --good-soft:#0F2E20; --warn:#F2B44C; --warn-soft:#33270B; --bad:#FF8676; --bad-soft:#3A1611; --chip:#1A2B4C;
  --bar:#5B8DEB; --grid:#1B2A47; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08111F; --surface:#0F1C33; --sunk:#0B1629; --ink:#E7EEFA; --muted:#9AAACB; --line:#203152;
  --brand:#0B2A5B; --brand-ink:#FFFFFF; --accent:#FF8A1F; --accent-ink:#1A0E00; --accent-soft:#3A230C;
  --good:#5BD19A; --good-soft:#0F2E20; --warn:#F2B44C; --warn-soft:#33270B; --bad:#FF8676; --bad-soft:#3A1611; --chip:#1A2B4C;
  --bar:#5B8DEB; --grid:#1B2A47; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;padding-bottom:80px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;font-weight:600}
h2{font-size:20px} h3{font-size:16px}
p{margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px 4px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:22px;font-weight:700}
.logo svg{width:30px;height:30px;color:#FF8A1F;flex:none}
.logo small{display:block;font-family:var(--font-body);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.75;margin-top:-3px}
.tright{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sync,.hbtn{font-size:12px;font-weight:800;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;display:flex;gap:6px;align-items:center;border:0}
.hbtn:hover{background:rgba(255,255,255,.2)}
.sync i{width:8px;height:8px;border-radius:50%;background:#9AAACB}
.sync.ok i{background:#5BD19A}.sync.warn i{background:#F2B44C}.sync.err i{background:#FF8676}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{color:var(--brand-ink);text-decoration:none;font-weight:800;font-size:14px;padding:10px 13px;border-radius:12px 12px 0 0;opacity:.8;white-space:nowrap}
nav.tabs a[aria-current="page"]{background:var(--bg);color:var(--ink);opacity:1}
main{padding-block:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.col{display:grid;gap:18px;min-width:0}
@media (max-width:880px){.grid2{grid-template-columns:minmax(0,1fr)}}
.sticky{position:sticky;top:120px}
@media (max-width:880px){.sticky{position:static}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:13px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
label.f{display:grid;gap:5px;font-size:13px;font-weight:700;color:var(--muted);min-width:0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=number],input[type=search],input[type=password],select,textarea{
  width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);min-width:0}
textarea{resize:vertical;min-height:90px;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.big-in{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;padding:12px 14px}
.btn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;font-weight:800;font-size:14px;display:inline-flex;gap:6px;align-items:center;justify-content:center;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.wa{background:#1FA855;border-color:#1FA855;color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.ghost{border-color:transparent;background:transparent;padding-inline:8px}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn.xl{padding:15px 18px;font-size:17px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:800;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--ink);white-space:nowrap}
.lv-0{background:#F3E1CF;color:#6E3B12} .lv-1{background:#E3E8EF;color:#3B4A60} .lv-2{background:#FFE7A0;color:#6A4A00}
:root[data-theme="dark"] .lv-0{background:#3B2715;color:#F3C9A0}
:root[data-theme="dark"] .lv-1{background:#26324A;color:#D2DCEB}
:root[data-theme="dark"] .lv-2{background:#3D3110;color:#FFD866}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lv-0{background:#3B2715;color:#F3C9A0}:root:not([data-theme="light"]) .lv-1{background:#26324A;color:#D2DCEB}:root:not([data-theme="light"]) .lv-2{background:#3D3110;color:#FFD866}}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.hot{background:var(--accent-soft);color:var(--accent)}
.note{border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}
.note.warn{background:var(--warn-soft);color:var(--warn)} .note.good{background:var(--good-soft);color:var(--good)} .note.info{background:var(--sunk);color:var(--muted)} .note.hot{background:var(--accent-soft);color:var(--ink)}
.wallet{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wallet>div{background:var(--sunk);border-radius:12px;padding:12px 14px;display:grid;gap:2px}
.wallet b{font-family:var(--font-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.wallet .cb b{color:var(--good)} .wallet .pt b{color:var(--warn)}
.who{display:flex;gap:12px;align-items:center;min-width:0}
.av{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:18px;flex:none}
.who .nm{font-weight:800;font-size:17px;overflow-wrap:anywhere}
.results{display:grid;gap:6px}
.res{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.res:hover{border-color:var(--accent)}
.res .r{text-align:right;font-size:13px;font-variant-numeric:tabular-nums}
.sum{display:grid;gap:8px}
.sum .l{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.sum .tot{border-top:2px dashed var(--line);padding-top:12px;margin-top:4px;align-items:baseline}
.sum .tot b{font-family:var(--font-display);font-size:34px;font-weight:600}
.earn{background:var(--good-soft);color:var(--good);border-radius:12px;padding:12px 14px;font-weight:700;display:grid;gap:2px}
.earn b{font-size:18px}
.prizes{display:grid;gap:8px}
.prize{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--sunk)}
.prize .p{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
tfoot td{font-weight:800;background:var(--sunk)}
.pos{color:var(--good);font-weight:700} .neg{color:var(--bad);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:4px;align-content:start}
.kpi b{font-family:var(--font-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi.hl{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.kpi.hl .eyebrow{color:var(--brand-ink);opacity:.75}
.segs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.segc{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;display:grid;gap:4px}
.segc b{font-family:var(--font-display);font-size:26px;font-weight:600}
.segc[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.list{display:grid;gap:8px}
.item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);flex-wrap:wrap}
.item .t{min-width:0;flex:1 1 200px}
.tpl{display:grid;gap:8px;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface)}
.tpl p{white-space:pre-wrap;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.vars{display:flex;gap:6px;flex-wrap:wrap}
.vars button{border:1px dashed var(--line);background:var(--sunk);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:700;font-family:ui-monospace,Menlo,monospace}
.bubble{background:#DCF8C6;color:#102A14;border-radius:12px 12px 2px 12px;padding:12px 14px;white-space:pre-wrap;font-size:14px;max-width:100%;overflow-wrap:anywhere}
:root[data-theme="dark"] .bubble{background:#1E4D2B;color:#E6F6EA}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bubble{background:#1E4D2B;color:#E6F6EA}}
.hist-note{font-size:13px;padding:8px 10px;border-radius:8px;background:var(--sunk)}
.empty{text-align:center;padding:28px 16px;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty b{color:var(--ink);font-size:16px}
.ok-ico{width:52px;height:52px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center}
.ok-ico svg{width:28px;height:28px}
#modal{position:fixed;inset:0;z-index:20;background:rgba(5,12,25,.55);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#modal .box{background:var(--surface);border-radius:16px;max-width:560px;width:100%;max-height:100%;overflow:auto;padding:20px;display:grid;gap:14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.25)}
#toast.err{background:var(--bad);color:#fff}
hr{border:0;border-top:1px solid var(--line);margin:0;width:100%}
.lvtbl input{padding:7px 9px}
/* gráfico */
.chart{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px}
.yax{position:relative;width:64px;height:180px;font-size:11px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.yax span{position:absolute;right:0;transform:translateY(50%)}
.plot{position:relative;height:180px;border-bottom:1px solid var(--muted)}
.plot .gl{position:absolute;left:0;right:0;border-top:1px solid var(--grid)}
.bars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:2px}
.bars .b{flex:1 1 0;min-width:0;height:100%;display:flex;align-items:flex-end;cursor:default;background:transparent;border:0;padding:0}
.bars .b i{display:block;width:100%;background:var(--bar);border-radius:4px 4px 0 0;min-height:0}
.bars .b:hover i,.bars .b:focus-visible i{background:var(--accent)}
.xax{grid-column:2;display:flex;gap:2px;font-size:11px;color:var(--muted)}
.xax span{flex:1 1 0;min-width:0;text-align:center;white-space:nowrap;overflow:visible}
#tip{position:absolute;z-index:3;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-100%)}
.metric{display:grid;gap:2px;padding:12px 0;border-bottom:1px solid var(--line)}
.metric:last-child{border-bottom:0}
.metric b{font-family:var(--font-display);font-size:22px;font-weight:600}
/* login e totem */
.login{max-width:520px;margin:30px auto;display:grid;gap:14px}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.member{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;display:grid;gap:6px;justify-items:center;text-align:center}
.member[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
#totem{position:fixed;inset:0;z-index:30;background:var(--brand);color:#fff;overflow:auto;padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tt{max-width:920px;margin:0 auto;display:grid;gap:22px}
.tt h1{font-size:clamp(28px,5vw,44px);font-weight:700}
.tt .lead{font-size:18px;opacity:.85}
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:760px){.tgrid{grid-template-columns:minmax(0,1fr)}}
.tdisp{background:rgba(255,255,255,.1);border-radius:16px;padding:16px 20px;font-size:clamp(26px,5vw,36px);font-weight:800;letter-spacing:.04em;min-height:72px;font-variant-numeric:tabular-nums}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{height:68px;border-radius:14px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:28px;font-weight:800;font-family:var(--font-display)}
.keypad button:active{background:rgba(255,255,255,.28)}
.keypad .ok{background:#FF8A1F;color:#1A0E00}
.tcard{background:#fff;color:#0B2A5B;border-radius:20px;padding:24px;display:grid;gap:16px}
.tcard .big{font-family:var(--font-display);font-size:clamp(34px,5vw,48px);font-weight:600;line-height:1;color:#1D7F53;font-variant-numeric:tabular-nums}
.tcard .pts{color:#9A5B00}
.tcard .fields{gap:20px 28px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.prog{height:12px;border-radius:999px;background:#EEF3FA;overflow:hidden}
.prog i{display:block;height:100%;background:#FF7A00;border-radius:999px}
.texit{justify-self:end;background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
@media (prefers-reduced-motion:no-preference){.btn,.res,.segc{transition:border-color .15s,background .15s}}
</style>

<script>
/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BRL = new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL'});
const money = v => BRL.format(+v || 0);
const moneyShort = v => v >= 1000 ? 'R$ ' + (v / 1000).toLocaleString('pt-BR', {maximumFractionDigits:1}) + ' mil' : 'R$ ' + Math.round(v).toLocaleString('pt-BR');
const r2 = v => Math.round((+v || 0) * 100) / 100;
const parseMoney = s => { s = String(s ?? '').replace(/[^\d,.-]/g, ''); if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); const n = parseFloat(s); return isFinite(n) && n > 0 ? r2(n) : 0; };
const moneyIn = v => v ? r2(v).toFixed(2).replace('.', ',') : '';
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const DAY = 864e5;
const dayKey = d => new Date(d).toLocaleDateString('sv');
const today = () => dayKey(Date.now());
const fmtDate = d => d ? new Date(d).toLocaleDateString('pt-BR') : '—';

/* ---------- saldos (calculados do histórico) ---------- */
function nivelPor(gasto) {
  const nv = cfg().niveis.map((n, i) => ({...n, idx:i})).sort((a, b) => b.min - a.min);
  return nv.find(n => gasto >= n.min) || nv[nv.length - 1];
}
function stats(c) {
  if (statCache.has(c.id)) return statCache.get(c.id);
  const v = +cfg().validadeDias || 0, now = Date.now();
  const movs = [...(c.mov || [])].sort((a, b) => a.data < b.data ? -1 : 1);
  const lots = []; let pts = 0, gasto12 = 0, gastoTot = 0, compras = 0, ultima = null, primeira = null;
  for (const m of movs) {
    const t = Date.parse(m.data);
    if (m.cbUsado > 0) { let r = m.cbUsado; for (const l of lots) { if (l.exp && l.exp < t) continue; const u = Math.min(l.rest, r); l.rest = r2(l.rest - u); r = r2(r - u); if (r <= 0) break; } }
    if (m.cbGerado > 0) lots.push({rest:m.cbGerado, exp: v ? t + v * DAY : 0});
    pts += (m.pts || 0) - (m.ptsUsados || 0);
    if (m.t === 'compra') { gastoTot += m.pago; compras++; ultima = m.data; primeira = primeira || m.data; if (now - t < 365 * DAY) gasto12 += m.pago; }
  }
  const ativos = lots.filter(l => l.rest > 0.004 && (!l.exp || l.exp > now));
  const saldo = r2(ativos.reduce((s, l) => s + l.rest, 0));
  const venc = ativos.filter(l => l.exp && l.exp - now <= 7 * DAY);
  const s = {saldo, pts:Math.max(0, pts), gasto12:r2(gasto12), gastoTot:r2(gastoTot), compras, ultima, primeira,
    ticket: compras ? r2(gastoTot / compras) : 0, nivel: nivelPor(gasto12),
    vencendo: r2(venc.reduce((s, l) => s + l.rest, 0)), vencData: venc.length ? Math.min(...venc.map(l => l.exp)) : null};
  statCache.set(c.id, s); return s;
}
function premioDisp(p) {
  if (p.estoque === '' || p.estoque == null) return null;
  let usados = 0; const desde = p.estoqueEm || '';
  for (const c of clientes()) for (const m of (c.mov || [])) if (m.t === 'resgate' && m.premioId === p.id && m.data >= desde) usados++;
  return Math.max(0, +p.estoque - usados);
}

/* ---------- armazenamento ---------- */
const LS_KEY = 'gatecao-fidelidade-v1';
function saveLocal() {
  const o = {}; for (const k of COLS) o[k] = [...S[k].values()];
  try { localStorage.setItem(LS_KEY, JSON.stringify(o)); } catch (e) { toast('Não foi possível salvar neste navegador.', true); }
}
function startLocal(motivo) {
  mode = 'local';
  let data = null; try { data = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) {}
  if (!data) data = {premios:DEFAULT_PREMIOS.map(p => ({...p, id:newId()})), mensagens:DEFAULT_MSGS.map((m, i) => ({...m, ordem:i, id:newId()})), config:[{...DEFAULT_CFG, id:'geral'}]};
  if (data.config && !Array.isArray(data.config)) data.config = [{...data.config, id:'geral'}];
  for (const k of COLS) S[k] = new Map((data[k] || []).map(d => [d.id, d]));
  setSync('warn', motivo || 'Salvo neste navegador');
  saveLocal(); changed();
}
function startDb() {
  mode = 'db';
  const pending = new Set(COLS);
  const timer = setTimeout(() => { if (pending.size) setSync('warn', 'Sem resposta do banco ainda'); }, 10000);
  const onErr = e => { clearTimeout(timer); setSync('err', e && e.code === 'revoked' ? 'Acesso aos dados encerrado' : 'Erro ao ler os dados'); };
  for (const col of COLS) {
    db.collection(col).onSnapshot(snap => {
      S[col] = new Map(snap.docs.map(d => [d.id, {...clone(d.data()), id:d.id}]));
      if (!snap.metadata.fromCache) { pending.delete(col); if (!pending.size) { clearTimeout(timer); setSync('ok', 'Salvo na nuvem'); } }
      changed(true);
    }, onErr);
  }
}
async function put(col, id, data) {
  const body = {...data}; delete body.id;
  S[col].set(id, {...body, id}); changed();
  if (mode === 'local') { saveLocal(); return true; }
  try { await db.collection(col).doc(id).set(body); return true; }
  catch (e) {
    const msg = e && e.code === 'quota_exceeded' ? 'Limite de armazenamento atingido. Exporte um backup e exclua registros antigos.'
      : e && e.code === 'invalid_argument' && ['config', 'premios', 'campanhas'].includes(col) ? 'Sem permissão para alterar isso: é preciso acesso de Editor nesta página.'
      : 'Não foi possível salvar: ' + (e && e.message || 'erro');
    toast(msg, true); return false;
  }
}
async function del(col, id) {
  S[col].delete(id); changed();
  if (mode === 'local') { saveLocal(); return; }
  try { await db.collection(col).doc(id).delete(); } catch (e) { toast('Não foi possível excluir: ' + (e && e.message || 'erro'), true); }
}
function setSync(kind, text) { const el = $('#sync'); el.className = 'sync ' + kind; el.querySelector('span').textContent = text; }
function changed(fromSnapshot) {
  statCache = new Map();
  $('#loja-nome').textContent = cfg().loja || 'Gatecão';
  if (opId && temEquipe() && !op()) { opId = null; lsSet('gf-op', null); }
  if (fromSnapshot) requestRender(); else render();

function requestRender() {
  const a = document.activeElement;
  if ((a && a.matches('input,textarea,select') && $('#main').contains(a)) || !$('#modal').hidden) { pendingRender = true; return; }
  render();
}

function readClienteForm(f, existing) {
  const fd = new FormData(f), tel = digits(fd.get('telefone'));
  const nome = String(fd.get('nome') || '').trim();
  if (!nome) { toast('Informe o nome do cliente', true); return null; }
  if (tel.length < 10) { toast('Telefone com DDD, ex.: (11) 98765-4321', true); return null; }
  const dup = clientes().find(c => digits(c.telefone) === tel && (!existing || c.id !== existing.id));
  if (dup) { toast(`Já existe cliente com esse telefone: ${dup.nome}`, true); return null; }
  const c = {...(existing ? clone(existing) : {id:newId(), criadoEm:new Date().toISOString(), mov:[], notas:[]}),
    nome, telefone:tel, email:String(fd.get('email') || '').trim(), cpf:digits(fd.get('cpf')), aniversario:fd.get('aniversario') || '',
    tags:String(fd.get('tags') || '').split(',').map(t => t.trim()).filter(Boolean), obs:String(fd.get('obs') || '').trim()};
  if (fd.has('indicadoPor')) {
    const v = String(fd.get('indicadoPor') || '').trim();
    if (!v) delete c.indicadoPor;
    else {
      const d = digits(v.split('·')[1] || ''), nv = norm(v.split('·')[0]).trim();
      const cands = clientes().filter(x => x.id !== c.id && (d.length >= 10 ? digits(x.telefone) === d : norm(x.nome) === nv));
      if (cands.length !== 1) { toast('Não encontrei quem indicou. Escolha um nome da lista de sugestões.', true); return null; }
      c.indicadoPor = cands[0].id;
    }
  }
  return c;
}

function chartHtml() {
  const vs = vendasTodas(), now = new Date(), keys = [], labels = [], fullLbl = [];
  if (ui.chart === 'dias') {
    for (let i = 29; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i); keys.push(dayKey(d)); labels.push(i % 5 === 0 ? d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'}) : ''); fullLbl.push(d.toLocaleDateString('pt-BR', {weekday:'short', day:'2-digit', month:'2-digit'})); }
  } else {
    for (let i = 11; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); keys.push(dayKey(d).slice(0, 7)); labels.push(d.toLocaleDateString('pt-BR', {month:'short'}).replace('.', '')); fullLbl.push(d.toLocaleDateString('pt-BR', {month:'long', year:'numeric'})); }
  }
  const idx = new Map(keys.map((k, i) => [k, i])), val = keys.map(() => 0), cnt = keys.map(() => 0);
  for (const v of vs) { const k = ui.chart === 'dias' ? dayKey(v.data) : dayKey(v.data).slice(0, 7); if (idx.has(k)) { val[idx.get(k)] += v.pago; cnt[idx.get(k)]++; } }
  const max = Math.max(...val, 0);
  const step = (() => { if (!max) return 100; const raw = max / 3, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; })();
  const top = step * Math.max(1, Math.ceil(max / step));
  const ticks = []; for (let t = 0; t <= top + 1e-9; t += step) ticks.push(t);
  const total = r2(val.reduce((a, b) => a + b, 0));
  return `<div class="row between"><div><h3>Faturamento ${ui.chart === 'dias' ? 'por dia' : 'por mês'}</h3><span class="small muted">${ui.chart === 'dias' ? 'Últimos 30 dias' : 'Últimos 12 meses'}: ${money(total)}</span></div>
    <div class="seg"><button data-act="chart" data-v="dias" aria-pressed="${ui.chart === 'dias'}">30 dias</button><button data-act="chart" data-v="meses" aria-pressed="${ui.chart === 'meses'}">12 meses</button></div></div>
    ${!max ? '<div class="note info">Ainda não há vendas neste intervalo. O gráfico aparece assim que as vendas forem registradas.</div>' : `
    <div class="chart" id="chart" role="img" aria-label="Faturamento ${ui.chart === 'dias' ? 'diário dos últimos 30 dias' : 'mensal dos últimos 12 meses'}, total ${money(total)}">
      <div class="yax">${ticks.map(t => `<span style="bottom:${t / top * 100}%">${moneyShort(t)}</span>`).join('')}</div>
      <div class="plot">${ticks.slice(1).map(t => `<div class="gl" style="bottom:${t / top * 100}%"></div>`).join('')}
        <div class="bars">${val.map((v, i) => `<button class="b" type="button" data-tip="${esc(fullLbl[i])}: ${esc(money(v))} · ${plural(cnt[i], 'venda', 'vendas')}" aria-label="${esc(fullLbl[i])}: ${esc(money(v))}"><i style="height:${v / top * 100}%"></i></button>`).join('')}</div>
        <div id="tip" hidden></div></div>
      <div class="xax">${labels.map(l => `<span>${esc(l)}</span>`).join('')}</div>
    </div>`}`;
}

function backupJson() {
  const o = {app:'gatecao-fidelidade', versao:2, exportadoEm:new Date().toISOString()};
  for (const k of COLS) o[k] = [...S[k].values()];
  return JSON.stringify(o);
}
async function importar(txt) {
  let d; try { d = JSON.parse(txt); } catch (e) { return toast('Texto de backup inválido', true); }
  if (!d || d.app !== 'gatecao-fidelidade') return toast('Esse texto não é um backup deste sistema', true);
  if (d.config && !Array.isArray(d.config)) d.config = [{...d.config, id:'geral'}];
  toast('Restaurando…');
  for (const col of COLS) {
    if (!d[col]) continue;
    const novos = new Set(d[col].map(x => x.id));
    for (const id of [...S[col].keys()]) if (!novos.has(id)) await del(col, id);
    for (const x of d[col]) await put(col, x.id, x);
  }
  ui.importTxt = ''; confirmKey = null; toast('Backup restaurado'); render();
}

/* ---------- modo consulta (totem) ---------- */
function abrirTotem() { Object.assign(totem, {on:true, tel:'', cid:null, sair:false, pin:''}); $('#totem').hidden = false; document.body.style.overflow = 'hidden'; renderTotem(); }
function fecharTotem() { totem.on = false; clearTimeout(totem.timer); $('#totem').hidden = true; $('#totem').innerHTML = ''; document.body.style.overflow = ''; if (location.hash === '#consulta') location.hash = 'pdv'; }
function totemReset(ms) { clearTimeout(totem.timer); totem.timer = setTimeout(() => { Object.assign(totem, {tel:'', cid:null, sair:false, pin:''}); if (totem.on) renderTotem(); }, ms); }
function totemBuscar() {
  const d = digits(totem.tel); if (d.length < 8) return toast('Digite o telefone com DDD', true);
  const m = clientes().filter(c => digits(c.telefone) === d || (d.length >= 8 && digits(c.telefone).endsWith(d.slice(-8))));
  totem.cid = m.length === 1 ? m[0].id : 'nao'; renderTotem(); totemReset(25000);
}
function renderTotem() {
  const el = $('#totem'), c = totem.cid && totem.cid !== 'nao' ? S.clientes.get(totem.cid) : null, conf = cfg();

  let res = '';
  if (c) {
    const s = stats(c), ps = premios(), prox = ps.find(p => p.pontos > s.pts), pode = ps.filter(p => p.pontos <= s.pts);
    const nx = conf.niveis.map((n, i) => ({...n, idx:i})).filter(n => n.min > s.gasto12).sort((a, b) => a.min - b.min)[0];
    const ks = campAtivas(c, s);
    res = `<div class="tcard">

      ${nx ? `<span class="small">Gaste mais ${money(nx.min - s.gasto12)} até completar 12 meses e vire <b>${esc(nx.nome)}</b> (${nx.cb}% de cashback).</span>` : ''}

  }
  el.innerHTML = `<div class="tt">
    ${sair}
    <div><h1>Consulte seu cashback</h1><p class="lead">Digite seu telefone com DDD para ver seu saldo e seus pontos no clube ${esc(conf.loja)}.</p></div>

    </div>

  </div>`;

  'tpl-usar': el => { ui.envioTpl = el.dataset.t; render(); const e = $('#envio'); if (e) e.scrollIntoView({behavior:'smooth', block:'start'}); },
  'tpl-padrao': async () => { for (const [i, m] of DEFAULT_MSGS.entries()) await put('mensagens', newId(), {...m, ordem:i}); toast('Modelos carregados'); },
  'ins-var': el => { const ta = $('#tpl-txt'), v = `{${el.dataset.v}}`, s = ta.selectionStart ?? ta.value.length; ta.value = ta.value.slice(0, s) + v + ta.value.slice(ta.selectionEnd ?? s); ta.focus(); ta.selectionStart = ta.selectionEnd = s + v.length; },
  'membro-novo': () => { ui.membroNovo = !ui.membroNovo; render(); setTimeout(() => $('#mb-nome') && $('#mb-nome').focus()); },
  'membro-del': async el => { confirmKey = null; const ms = equipe().filter(m => m.id !== el.dataset.m);
    if (ms.length && !ms.some(m => m.papel === 'gerente')) return toast('A equipe precisa de pelo menos um gerente.', true);
    await put('config', 'equipe', {membros:ms}); toast('Pessoa removida'); },

    const txt = backupJson(), name = `backup-fidelidade-${today()}.json`;

    if (dl) { try { await dl.save({filename:name, data:txt}); } catch (e) { toast('Download não concluído. Use “Gerar backup” e copie o texto.', true); } return; }
    if (!(window.claude && window.claude.use)) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], {type:'application/json'})); a.download = name; a.click(); return; }
    toast('Download indisponível aqui. Use “Gerar backup” e copie o texto.', true);
  },
  'bk-import': () => { if (adminOk()) importar($('#bk-text').value); },
  'tt-key': el => { const k = el.dataset.k; if (totem.cid) { totem.cid = null; totem.tel = ''; } if (k === 'del') totem.tel = totem.tel.slice(0, -1); else if (totem.tel.length < 11) totem.tel += k; renderTotem(); totemReset(60000); },
  'tt-ok': () => totemBuscar(),

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = A[el.dataset.act]; if (f) { if (el.tagName !== 'A') e.preventDefault(); f(el); }
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') { modal = null; renderModal(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modal) { modal = null; renderModal(); }
  if (totem.on && !totem.sair && !e.target.matches('input')) { if (/^\d$/.test(e.key)) A['tt-key']({dataset:{k:e.key}}); else if (e.key === 'Backspace') A['tt-key']({dataset:{k:'del'}}); else if (e.key === 'Enter') totemBuscar(); return; }
  if (e.key === 'Enter' && e.target.matches('#pdv-valor,#pdv-desc,#pdv-cb,#pdv-rec') && calc().valor > 0) { e.preventDefault(); finalizar(); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.bind) { pdv[el.dataset.bind] = el.value; if (el.dataset.bind === 'busca') $('#pdv-res').innerHTML = pdvResults(); else renderResumo(); }
  else if (el.dataset.bindf) { const dia = ui.fechDia || today(); fechVals(dia).f[el.dataset.bindf] = el.value; renderFechCalc(); }
  else if (el.dataset.bindUi === 'cliBusca') { ui.cliBusca = el.value; const pos = el.selectionStart; render(); const n = $('#cli-busca'); n.focus(); n.setSelectionRange(pos, pos); }
  else if (el.id === 'msg-text' && modal) { modal.text = el.value; $('#msg-wa').href = waLink(S.clientes.get(modal.cid).telefone, el.value); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'msg-tpl' && modal) { const t = S.mensagens.get(el.value); modal.tplId = el.value; modal.text = fill(t.texto, S.clientes.get(modal.cid), modal.extra); renderModal(); }

  else if (el.id === 'envio-tpl') { ui.envioTpl = el.value; render(); }

  else if (el.id === 'bk-file' && el.files[0]) { const r = new FileReader(); r.onload = () => { ui.importTxt = String(r.result); confirmKey = 'bk-imp'; render(); toast('Arquivo carregado. Confira e confirme a restauração.'); }; r.readAsText(el.files[0]); }
});
document.addEventListener('focusout', () => setTimeout(() => { if (pendingRender && !document.activeElement.matches('input,textarea,select') && $('#modal').hidden) render(); }, 150));
function showTip(e) {
  const b = e.target.closest && e.target.closest('.bars .b'), tip = $('#tip'); if (!tip) return;
  if (!b) { tip.hidden = true; return; }
  const plot = b.closest('.plot').getBoundingClientRect(), r = b.getBoundingClientRect(), bar = b.firstElementChild.getBoundingClientRect();
  tip.textContent = b.dataset.tip; tip.hidden = false;
  const half = tip.offsetWidth / 2, x = Math.max(half, Math.min(plot.width - half, r.left - plot.left + r.width / 2));
  tip.style.left = x + 'px'; tip.style.top = Math.max(tip.offsetHeight, bar.top - plot.top - 6) + 'px';
}
document.addEventListener('mouseover', showTip);
document.addEventListener('focusin', showTip);
document.addEventListener('submit', async e => {
  e.preventDefault(); const f = e.target, fd = new FormData(f), k = f.dataset.form;
  if (k === 'login') { const m = equipe().find(x => x.id === ui.loginSel); if (!m) return;
    if (pinHash(String(fd.get('pin')), m.id) !== m.pinHash) { toast('PIN incorreto', true); f.reset(); return; }
    opId = m.id; lsSet('gf-op', m.id); ui.loginSel = null; toast(`Bom trabalho, ${firstName(m.nome)}!`); render(); }
  else if (k === 'totem-sair') { const pin = String(fd.get('pin')); if (equipe().some(m => m.papel === 'gerente' && pinHash(pin, m.id) === m.pinHash)) fecharTotem(); else { toast('PIN de gerente incorreto', true); f.reset(); } }
  else if (k === 'pdvnovo') { const c = readClienteForm(f); if (!c) return; if (await put('clientes', c.id, c)) { Object.assign(pdv, {clienteId:c.id, novo:false, busca:''}); toast('Cliente cadastrado'); render(); } }
  else if (k === 'clinovo') { const c = readClienteForm(f); if (!c) return; if (await put('clientes', c.id, c)) { ui.editando = false; ui.cliSel = c.id; toast('Cliente cadastrado'); render(); } }
  else if (k === 'cliedit') { const c = readClienteForm(f, S.clientes.get(ui.cliSel)); if (!c) return; if (await put('clientes', c.id, c)) { ui.editando = false; toast('Dados salvos'); render(); } }
  else if (k === 'ajuste') {
    if (!gerenteOk('ajustar saldos')) return;
    const c = clone(S.clientes.get(ui.cliSel)), q = fd.get('tipo') === 'cb' ? parseMoney(fd.get('qtd')) : Math.round(parseMoney(fd.get('qtd'))), add = fd.get('op') === '+';
    if (!q) return toast('Informe a quantidade', true);
    const m = {id:newId(), t:'ajuste', data:new Date().toISOString(), desc:String(fd.get('motivo')).trim(), op:opNome()};
    if (fd.get('tipo') === 'cb') add ? m.cbGerado = q : m.cbUsado = Math.min(q, stats(c).saldo); else add ? m.pts = q : m.ptsUsados = Math.min(q, stats(c).pts);
    c.mov = [...(c.mov || []), m]; ui.ajuste = false; await put('clientes', c.id, c); toast('Saldo ajustado');
  }
  else if (k === 'proximo') { const c = clone(S.clientes.get(ui.cliSel)); if (!fd.get('data')) return toast('Escolha a data do contato', true); c.proximo = {data:fd.get('data'), assunto:String(fd.get('assunto')).trim()}; await put('clientes', c.id, c); toast('Contato agendado'); }
  else if (k === 'nota') { const txt = String(fd.get('texto')).trim(); if (!txt) return; const c = clone(S.clientes.get(ui.cliSel)); c.notas = [...(c.notas || []), {id:newId(), data:new Date().toISOString(), tipo:'nota', op:opNome(), texto:txt}]; await put('clientes', c.id, c); }
  else if (k === 'fech') {
    const dia = ui.fechDia || today(), x = fechVals(dia);
    if (x.f.contado === '') return toast('Informe o dinheiro contado na gaveta', true);
    const porForma = {}; for (const [kk, v] of Object.entries(x.r.porForma)) porForma[kk] = v.v;
    if (await put('fechamentos', dia, {fundo:parseMoney(x.f.fundo), sangria:parseMoney(x.f.sangria), dinheiro:x.din, esperado:x.esperado, contado:x.contado, diferenca:x.dif, total:x.r.total, vendas:x.r.vs.length, porForma, obs:x.f.obs.trim(), por:opNome(), em:new Date().toISOString()})) { ui.refazer = false; toast('Caixa fechado'); }
  }
  else if (k === 'camp') { if (!adminOk()) return;
    const ini = fd.get('inicio'), fim = fd.get('fim'); if (!ini || !fim || fim < ini) return toast('Confira as datas: o fim deve ser depois do início', true);
    const old = typeof ui.campEdit === 'string' ? S.campanhas.get(ui.campEdit) : null, id = old ? old.id : newId();
    const data = {nome:String(fd.get('nome')).trim(), inicio:ini, fim, publico:fd.get('publico'), multCb:Math.max(1, +fd.get('multCb') || 1), extraPct:Math.max(0, +fd.get('extraPct') || 0), multPts:Math.max(1, +fd.get('multPts') || 1), ativo: old ? old.ativo !== false : true};
    if (!data.nome) return toast('Dê um nome para a campanha', true);
    ui.campEdit = null; await put('campanhas', id, data); toast('Campanha salva'); }
  else if (k === 'premio') { if (!adminOk()) return;
    const id = ui.premioEdit === 'novo' ? newId() : ui.premioEdit, old = S.premios.get(id), pts = Math.round(+fd.get('pontos'));
    if (!String(fd.get('nome')).trim() || !(pts > 0)) return toast('Informe nome e custo em pontos', true);
    const est = String(fd.get('estoque')).trim(), estN = est === '' ? '' : Math.max(0, Math.round(+est));
    const mudouEst = !old || estN !== premioDisp(old) && !(estN === '' && premioDisp(old) === null);
    ui.premioEdit = null;
    await put('premios', id, {nome:String(fd.get('nome')).trim(), pontos:pts, estoque:estN, estoqueEm: mudouEst ? new Date().toISOString() : (old.estoqueEm || ''), descricao:String(fd.get('descricao')).trim()}); toast('Prêmio salvo'); }
  else if (k === 'tpl') { if (!gerenteOk('editar modelos')) return; const id = ui.tplSel === 'novo' ? newId() : ui.tplSel, old = S.mensagens.get(id) || {};
    ui.tplSel = null; await put('mensagens', id, {...old, titulo:String(fd.get('titulo')).trim(), gatilho:fd.get('gatilho'), texto:String(fd.get('texto')), ordem: old.ordem ?? 50}); toast('Modelo salvo'); }
  else if (k === 'membro') {
    const nome = String(fd.get('nome')).trim(), pin = digits(fd.get('pin'));
    if (!nome) return toast('Informe o nome', true);
    if (pin.length < 4) return toast('O PIN precisa ter de 4 a 8 números', true);
    const id = newId(), m = {id, nome, papel:fd.get('papel'), pinHash:pinHash(pin, id)}, era = equipe().length;
    if (!era && m.papel !== 'gerente') return toast('A primeira pessoa precisa ser gerente.', true);
    ui.membroNovo = false;
    if (await put('config', 'equipe', {membros:[...equipe(), m]})) { if (!era) { opId = id; lsSet('gf-op', id); } toast(era ? 'Pessoa adicionada' : `Equipe criada. Você entrou como ${firstName(nome)}.`); render(); }
  }
  else if (k === 'cfg') { if (!adminOk()) return;
    const n = cfg().niveis.map((x, i) => ({nome:String(fd.get(`nv${i}nome`)).trim() || x.nome, min: i === 0 ? 0 : Math.max(0, +fd.get(`nv${i}min`) || 0), cb: Math.max(0, Math.min(100, +fd.get(`nv${i}cb`) || 0))}));
    const num = (k2, max = Infinity) => Math.max(0, Math.min(max, +fd.get(k2) || 0));
    await put('config', 'geral', {loja:String(fd.get('loja')).trim() || 'Gatecão', ptsPorReal:num('ptsPorReal'), validadeDias:Math.round(num('validadeDias')), maxUsoPct:num('maxUsoPct', 100), minCompraUso:num('minCompraUso'), bonusIndicador:num('bonusIndicador'), bonusIndicado:num('bonusIndicado'), niveis:n});
    toast('Regras salvas');
  }
});
