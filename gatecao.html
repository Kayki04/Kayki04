    if(!ev.length)h+='<p class="muted">Nenhum aviso ainda. Pedidos, agendamentos, cancelamentos e recompras aparecem aqui na hora.</p>';
    ev.forEach(function(e){h+='<div class="hist'+(e.ts>seen?' unread':'')+'"><div class="row"><b>'+esc(e.title)+'</b><span class="muted">'+fmtTs(e.ts)+'</span></div><span>'+esc(e.body)+'</span><div class="apact"><button class="ghost" data-ago="'+esc(e.seg)+'">Abrir</button></div></div>'});
    $('#overlay').innerHTML=sheetHtml(h,'Avisos da loja');bindClose();bindSysNotify(openAdmAlerts);
    $('#autoRem').onclick=async function(){var on=this.getAttribute('aria-checked')!=='true';this.setAttribute('aria-checked',on);try{await X.db.doc('settings/store').set(Object.assign({},D.settings,{autoRemind:on}));toast(on?'Lembretes ligados':'Lembretes desligados')}catch(e){wfail(e)}};
    $$('[data-ago]').forEach(function(b){b.onclick=function(){closeSheet();state.adm.tab='pedidos';state.adm.ord=b.getAttribute('data-ago');renderAdmin()}});
    var mx=ev.reduce(function(a,e){return Math.max(a,e.ts)},0);if(mx>seen){save('gc_admseen',mx);var bn=$('#aBell .n');if(bn)bn.remove()}
  }
  /* lembretes automáticos enviados quando a Gestão está aberta */
  var AUTO={busy:false,done:{}};
  async function admAuto(){
    if(AUTO.busy||S('autoRemind',true)===false||!X.db||!D.ready.status)return;
    AUTO.busy=true;
    try{
      var t1=addDays(todayStr(),1);
      var aps=allAppts().filter(function(a){return a.day===t1&&apStatus(a)==='Agendado'&&a.uid&&!(D.status[a.id]&&D.status[a.id].reminded)&&!AUTO.done['a'+a.id]});
      for(var i=0;i<aps.length&&i<20;i++){
        var a=aps[i];AUTO.done['a'+a.id]=1;
        await notifyUser(a.uid,'Lembrete: banho amanhã','Amanhã às '+a.slot+' tem '+String(a.svc).split(' + ')[0].toLowerCase()+' do '+a.pet+' na Gatecão.'+(a.lt?' Vamos buscar no endereço informado.':'')+' Precisa mudar? Remarque pelo app.','agenda');
        await X.db.doc('status/'+a.id).set(Object.assign({},D.status[a.id]||{status:'Agendado'},{reminded:true}));
      }
      var rs=allRecs().filter(function(r){return r.active&&r.next===t1&&r.notified!==r.next&&!AUTO.done['r'+r.id+r.next]});
      for(var k=0;k<rs.length&&k<20;k++){
        var r=rs[k];AUTO.done['r'+r.id+r.next]=1;
        await notifyUser(r.uid,'Sua recompra é amanhã','Vamos separar '+r.q+' x '+r.n+' para amanhã. Quer mudar a data ou pausar? É só abrir Meu Pet no app.','pedido');
        await recPatch(r.uid,r.id,{notified:r.next});
      }
      var t0=todayStr(),allA=allAppts(),sent=0,SM=statsMap(),ext={};
      var mkCoupon=async function(uid,prefix,pct,auto){var code;do{code=prefix+(1000+Math.floor(Math.random()*9000))}while(D.coupons.some(function(x){return x.code===code}));await X.db.collection('coupons').doc().set({code:code,kind:'percent',value:pct,min:0,start:t0,end:addDays(t0,10),first:false,once:true,show:false,active:true,uid:uid,auto:auto});return code};
      for(var ci=0;ci<D.customers.length&&sent<15;ci++){
        var c=D.customers[ci],uid=c.id;if(!uid)continue;
        var feed=JSON.parse(JSON.stringify(c.feed||{})),bn=Object.assign({},c.bn||{}),dirty=false,fk=Object.keys(feed);ext={};
        if(c.refCode&&!c.refDone){var rf=D.customers.filter(function(x){return x.code&&String(x.code).toUpperCase()===String(c.refCode).toUpperCase()&&x.id!==uid})[0],fc=(D.ficha||{})[uid]||{};
          if(rf&&!fc.indicadoPor){await X.db.doc('pdv_ficha/'+uid).set(Object.assign({},fc,{indicadoPor:rf.id}))}
          ext.refDone=true;dirty=true}
        if(S('niverOn',true)!==false){var niv=Object.assign({},c.niv||{});
          for(var ni=0;ni<(c.pets||[]).length;ni++){var pt=c.pets[ni],bd=nextBday(pt.bd);if(!bd||bd.d>3)continue;var yk=petKey(pt.n)+'_'+bd.day.slice(0,4);if(niv[yk]||AUTO.done[uid+yk])continue;AUTO.done[uid+yk]=1;
            var pc=num(S('niverPct',10)),cc=await mkCoupon(uid,'NIVER',pc,'niver');
            await notifyUser(uid,'Aniversário '+(pt.sx==='F'?'da ':'do ')+pt.n+'!',(bd.d===0?'Hoje':'Em '+bd.d+' dia'+(bd.d===1?'':'s'))+' tem festa! Presente da Gatecão: cupom '+cc+' com '+pc+'% de desconto, válido por 10 dias.','oferta');
            niv[yk]=1;ext.niv=niv;dirty=true;sent++}
        }
        if(S('winOn',true)!==false){var stt=SM[uid],wd=Math.round(num(S('winDays',45)))||45;
          if(stt&&stt.last&&Date.now()-stt.last>wd*864e5&&(!c.win||Date.now()-c.win>90*864e5)&&!AUTO.done['w'+uid]){AUTO.done['w'+uid]=1;
            var wp=num(S('winPct',10)),wc=await mkCoupon(uid,'VOLTA',wp,'volta');
            await notifyUser(uid,'Sentimos sua falta, '+String(c.name||'').split(' ')[0]+'!','Preparamos um presente: cupom '+wc+' com '+wp+'% de desconto em qualquer compra no app, válido por 10 dias.','oferta');
            ext.win=Date.now();dirty=true;sent++}
        }
        for(var fi=0;fi<fk.length;fi++){
          var f=feed[fk[fi]];if(!f||f.done||!f.end||f.notified===f.end||f.start>t0||AUTO.done['f'+f.id+f.end])continue;
          var l=dayDiff(t0,f.end);if(l>3||l<-7)continue;AUTO.done['f'+f.id+f.end]=1;
          await notifyUser(uid,l<=0?'A ração está acabando':'A ração acaba em '+l+' dia'+(l===1?'':'s'),f.n+' ('+fmtKg(f.kg)+') deve acabar por volta de '+fmtDM(f.end)+'. Peça pelo app e não fique sem.','racao','fd_'+f.id+'_'+f.end);
          f.notified=f.end;dirty=true;sent++;
        }
        var ua=allA.filter(function(a){return a.uid===uid}),pets={};
        (c.pets||[]).forEach(function(p){var k=petKey(p.n);if(k&&!pets[k])pets[k]={n:p.n,po:p}});
        ua.forEach(function(a){var k=petKey(a.pet);if(k&&!pets[k])pets[k]={n:a.pet,po:null}});
        var pk=Object.keys(pets);
        for(var pi=0;pi<pk.length;pi++){
          var pp=pets[pk[pi]],bi=bathInfo(pp.n,ua,pp.po);if(bi.fut||!bi.next||bi.d>0||bi.d<-30)continue;
          var key='bh_'+pk[pi]+'_'+bi.next;if(bn[pk[pi]]===bi.next||AUTO.done[uid+key])continue;AUTO.done[uid+key]=1;
          await notifyUser(uid,'Hora do banho '+((pp.po&&pp.po.sx==='F')?'da ':'do ')+pp.n,'Último banho em '+fmtDM(bi.last)+', há '+bi.since+' dias. Agende pelo app e garanta seu horário.','agenda',key);
          bn[pk[pi]]=bi.next;dirty=true;sent++;
        }
        if(dirty){var cd=Object.assign({},c,{feed:feed,bn:bn},ext);delete cd.id;await X.db.doc('customers/'+uid).set(cd)}
      }
    }catch(e){}
    AUTO.busy=false;
  }

  /* ================= INÍCIO ================= */
  function subscribe(){
    function col(name,key,fn){
      X.db.collection(name).onSnapshot(function(s){fn(s);D.ready[key]=true;schedule()},function(e){D.ready[key]=true;D.err=e&&e.code;schedule()});
    }
    function plain(key){return function(s){D[key]=s.docs.map(function(d){return Object.assign({id:d.id},d.data())})}}
    col('products','products',plain('products'));
    col('promos','promos',plain('promos'));
    col('tables','tables',plain('tables'));
    col('services','services',plain('services'));
    col('slots','slots',function(s){var m={};s.docs.forEach(function(d){m[d.id]=Object.keys(slotMap(d.data()||{})).length||1});D.slots=m});
    col('status','status',function(s){var m={};s.docs.forEach(function(d){m[d.id]=d.data()});D.status=m});
    X.db.doc('settings/store').onSnapshot(function(s){D.settings=s.exists?s.data():{};D.ready.settings=true;schedule()},function(){D.ready.settings=true});
    col('rewards','rewards',plain('rewards'));
    col('bonus','bonus',plain('bonus'));
    col('banners','banners',plain('banners'));
    col('coupons','coupons',plain('coupons'));
    col('reviews','reviews',plain('reviews'));
    if(X.uid){
      X.db.doc('inbox/'+X.uid).onSnapshot(function(s){
        var m=s.exists&&s.data().m?s.data().m:{},arr=Object.keys(m).map(function(k){return m[k]}),prevMax=D.inbox.reduce(function(a,n){return Math.max(a,n.ts)},0);
        var fresh=D.inboxReady&&arr.some(function(n){return n.ts>prevMax&&n.ts>getSeen()});
        D.inbox=arr;D.inboxReady=true;updBell();if(fresh){var nw=arr.filter(function(n){return n.ts>prevMax}).sort(function(a,b){return b.ts-a.ts})[0];toast(nw?nw.title:'Nova mensagem da Gatecão');beep();if(nw)sysNotify(nw.title,nw.body)}schedule();
      },function(){});
      X.db.doc('orders/'+X.uid).onSnapshot(function(s){D.myPl=s.exists&&s.data().pl||null;var r=s.exists&&s.data().r?s.data().r:{},om=s.exists&&s.data().o?s.data().o:{};D.myOrd=Object.keys(om).map(function(k){return om[k]});D.myRec=Object.keys(r).map(function(k){return r[k]}).filter(function(x){return !x.deleted}).sort(function(a,b){return String(a.next).localeCompare(String(b.next))});schedule()},function(){});
      X.db.doc('wallet/'+X.uid).onSnapshot(function(s){D.wallets[X.uid]=s.exists?s.data():{};D.ready.wallet=true;schedule()},function(){D.ready.wallet=true});
      X.db.doc('customers/'+X.uid).onSnapshot(function(s){D.me=s.exists?s.data():null;D.ready.me=true;schedule()},function(){D.ready.me=true});
      X.db.doc('redeems/'+X.uid).onSnapshot(function(s){var r=s.exists&&s.data().r?s.data().r:{};D.myRedeems=Object.keys(r).map(function(k){return r[k]}).sort(function(a,b){return b.ts-a.ts});schedule()},function(){});
    }
    if(X.isAdmin){
      col('orders','orders',plain('orders'));col('appts','appts',plain('appts'));
      col('customers','customers',plain('customers'));
      col('crm','crm',function(s){var m={};s.docs.forEach(function(d){m[d.id]=d.data()});D.crm=m});
      col('redeems','redeems',plain('redeems'));
      col('campaigns','campaigns',plain('campaigns'));
      col('wallet','wallets',function(s){var m={};s.docs.forEach(function(d){m[d.id]=d.data()});D.wallets=m});
      col('pdv_ficha','ficha',function(s){var m={};s.docs.forEach(function(d){m[d.id]=d.data()});D.ficha=m});
    }
  }

  async function boot(){
    var h=location.hash.slice(1);
    if(['loja','banho','vantagens','pet','pedidos','gestao'].indexOf(h)>-1)state.tab=h;
    else if(h==='balcao'||h==='balcao-banho'){state.tab='gestao';state.adm.tab='balcao';MB.fromCaixa=true;MB.tab=(h==='balcao-banho'?'banho':'venda')}
    else if(h.indexOf('caixa')===0)state.tab='caixa';
    else if(h.indexOf('produto/')===0){state.tab='loja';PV.pending=decodeURIComponent(h.slice(8))}
    else if(h==='cart'){state.tab='loja';setTimeout(function(){try{if(cartCount())openCart()}catch(e){}},400)}
    renderCats();persist();render();
    try{
      if(!window.claude||!window.claude.use)throw new Error('sem runtime');
      X.db=await window.claude.use('db');
      X.user=await window.claude.use('user');
      X.assets=await window.claude.use('assets');
      try{X.dl=await window.claude.use('downloads')}catch(e){X.dl=null}
      if(X.user){try{X.uid=await X.user.id();X.isAdmin=!!(await X.user.canEdit())}catch(e){}}
    }catch(e){}
    X.checked=true;
    if(!X.db){D.nodb=true;render();return}
    subscribe();
    setTimeout(function(){if(!D.ready.products){D.slow=true;render()}},10000);
    render();
  }

  $$('nav.bar button').forEach(function(b){b.onclick=function(){go(b.getAttribute('data-go'))}});
  $('#openCart').onclick=openCart;
  $('#bellBtn').onclick=openInbox;
  $('#loginBtn').onclick=function(){if(window.GCFB&&GCFB.login)GCFB.login()};
  function varPick(e,root){
    var b=e.target.closest('[data-var]');if(!b)return false;
    var card=b.closest('[data-vg]'),np=byId(D.products,b.getAttribute('data-var'));if(!card||!np)return true;
    var g=varOf(np);if(!g)return true;
    state.varSel[g.key]=np.id;
    var tmp=document.createElement('div');tmp.innerHTML=varCard(g,np,+card.getAttribute('data-n')||0);
    var nc=tmp.firstChild;card.replaceWith(nc);
    var ab=nc.querySelector('[data-add]');if(ab)ab.onclick=function(){addToCart(ab.getAttribute('data-add'))};
    return true;
  }
  var CACT={installApp:installApp,legalPriv:function(){openLegal('priv')},legalTermos:function(){openLegal('termos')},lojaInfo:openLoja};
  view.addEventListener('click',function(e){
    var ca=e.target.closest('[data-act]');if(ca&&CACT[ca.getAttribute('data-act')]){e.preventDefault();CACT[ca.getAttribute('data-act')]();return}
    var fv=e.target.closest('[data-fav]');if(fv){e.preventDefault();toggleFav(fv.getAttribute('data-fav'));return}
    if(e.target.closest('[data-login]')){if(window.GCFB&&GCFB.login)GCFB.login();return}
    var pq=e.target.closest('[data-planreq]');if(pq){planRequest(pq.getAttribute('data-planreq'));return}
    if(varPick(e,view))return;
    var o=e.target.closest('[data-open]');if(o&&!e.target.closest('[data-add]')){showProduct(o.getAttribute('data-open'));return}
    var b=e.target.closest('[data-go2]');if(b)go(b.getAttribute('data-go2'));
  });
  document.addEventListener('keydown',function(e){
    if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-open][role="button"]')){e.preventDefault();showProduct(e.target.getAttribute('data-open'));return}
    if(e.key==='Escape'){if($('#overlay .sheet'))closeSheet();else if(PV.id)closePview()}
  });
  var hdr=$('header.top'),hdrCompact=false,hdrTick=false;
  function hdrUpd(){
    hdrTick=false;var y=window.scrollY||document.documentElement.scrollTop||0;
    if(!hdrCompact&&y>120){hdrCompact=true;hdr.classList.add('compact')}
    else if(hdrCompact&&y<12){hdrCompact=false;hdr.classList.remove('compact')}
  }
  window.addEventListener('scroll',function(){if(!hdrTick){hdrTick=true;requestAnimationFrame(hdrUpd)}},{passive:true});
  /* roda do mouse rola as barras horizontais (Gestão, categorias, chips...) */
  var HSCROLL='.atabs,.cats,.chips,.svcs,.days,.pets,.bchips,.hscroll,.pvthumbs,.fchips,.seg2,.vchips,.bntrack';
  (admEl.parentNode||document).addEventListener('wheel',function(e){
    if(e.ctrlKey||Math.abs(e.deltaX)>Math.abs(e.deltaY))return;
    var el=e.target.closest&&e.target.closest(HSCROLL);if(!el)return;
    if(el.scrollWidth<=el.clientWidth+1)return;
    var d=e.deltaMode===1?e.deltaY*16:e.deltaY;
    el.scrollLeft+=d;e.preventDefault();
  },{passive:false});
  var qT=0;
  $('#q').oninput=function(e){state.q=e.target.value;clearTimeout(qT);qT=setTimeout(function(){if(state.tab==='loja')renderShop()},160)};
  $('#q').onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();this.blur();clearTimeout(qT);renderShop();shopTop()}};
  window.addEventListener('hashchange',function(){
    var t=location.hash.slice(1);
    if(t.indexOf('produto/')===0){var pid=decodeURIComponent(t.slice(8));if(pid!==PV.id){if(D.ready.products)showProduct(pid,true);else PV.pending=pid}return}
    if(t==='balcao'||t==='balcao-banho'){if(PV.id)hidePview();MB.fromCaixa=true;MB.tab=(t==='balcao-banho'?'banho':'venda');state.tab='gestao';state.adm.tab='balcao';render();return}
    if(t.indexOf('caixa')===0){if(PV.id)hidePview();if(state.tab!=='caixa'){state.tab='caixa';render()}return}
    if(PV.id){hidePview();var a=PV.after;PV.after=null;if(a){a();return}}
    if(['loja','banho','vantagens','pet','pedidos','gestao'].indexOf(t)>-1&&t!==state.tab){state.tab=t;render();if(!reduced())anim(view,'enter')}
  });
  boot();

})();
</script>
