<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Gatecão Pet Shop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Layout: app claro e alegre. Topo branco com busca, categorias em círculos, banner laranja, serviços coloridos e produtos em cards com ofertas. Visual único (claro) nas cores da marca. */
:root{
  --bg:#FFFFFF; --soft:#FFF1E2; --sky:#E4EEFF; --sun:#FFE8A3;
  --ink:#0B2A5B; --muted:#5E6F8E; --line:#E3E9F3;
  --brand:#0B2A5B; --brand-ink:#FFFFFF; --accent:#FF7A00; --accent-ink:#0B2A5B; --accent-d:#C75500; --danger:#C2412D;
  --font-display:'Fredoka','Trebuchet MS',sans-serif; --font-body:'Nunito Sans','Segoe UI',system-ui,sans-serif;
  --r:16px; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 96px;max-width:640px;margin-inline:auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 4px;display:grid;gap:8px;box-shadow:0 1px 0 var(--line)}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:700;font-size:22px;color:var(--brand)}
.logo svg{width:29px;height:29px;color:var(--accent)}
.logo small{display:block;font-family:var(--font-body);font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:-4px}
.logoimg{height:42px;width:auto;display:block}
.cartbtn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:9px 14px;font-weight:800;display:flex;gap:8px;align-items:center}
.cartbtn svg{width:20px;height:20px}
.cartbtn .n{background:var(--brand);color:var(--brand-ink);border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;padding:0 6px}
.search{width:100%;border:2px solid var(--soft);background:var(--soft);border-radius:999px;padding:10px 16px}
.search::placeholder{color:var(--muted)}
.cats{display:flex;gap:6px;overflow-x:auto;padding-block:4px 6px;scrollbar-width:none}
.cat{flex:none;width:58px;border:0;background:none;display:grid;justify-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--ink);padding:0}
.cat .ci{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--sky);color:var(--brand)}
.cat:nth-child(even) .ci{background:var(--soft);color:var(--accent-d)}
.cat .ci svg{width:23px;height:23px}
.cat[aria-pressed="true"] .ci{background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent-d)}
.hero{position:relative;overflow:hidden;margin-block:10px 14px;border-radius:20px;background:linear-gradient(135deg,#FF7A00,#FFA23A);color:var(--brand);padding:16px 118px 16px 18px;min-height:128px;display:grid;align-content:center;gap:6px}
.hero .tag{justify-self:start;background:#fff;color:var(--accent-d);font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:4px 10px}
.hero h2{font-size:20px;line-height:1.08}
.hero p{margin:0;font-weight:600;font-size:13px}
.hero .cta{justify-self:start;border:0;background:var(--brand);color:#fff;border-radius:999px;padding:8px 15px;font-weight:800;margin-top:2px;font-size:14px}
.hero .art{position:absolute;right:-6px;bottom:-6px;width:118px;height:118px}
.hero .dot{position:absolute;border-radius:50%;background:rgba(255,255,255,.22)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin-block:14px 8px}
.sec h2{font-size:18px}.sec span{color:var(--muted);font-size:12.5px;font-weight:700}
.svcs{display:flex;gap:12px;overflow-x:auto;padding-block:2px 8px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.svc{flex:none;width:176px;border:0;border-radius:var(--r);padding:12px;text-align:left;display:grid;gap:5px;align-content:start;position:relative;overflow:hidden}
.svc .si{width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center}
.svc .si svg{width:28px;height:28px}
.svc b{font-family:var(--font-display);font-size:15px;line-height:1.1}
.svc .d{font-size:12px;font-weight:600;opacity:.85}
.svc .pp{font-weight:800;font-size:13px;display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.svc .pp i{font-style:normal;background:var(--brand);color:#fff;border-radius:999px;padding:5px 12px;font-size:12px}
.svc .hot{position:absolute;top:10px;right:10px;background:var(--accent);color:var(--brand);font-size:11px;font-weight:800;border-radius:999px;padding:3px 8px}
.s0{background:var(--sky);color:var(--brand)}.s0 .si{color:var(--brand)}
.s1{background:var(--soft);color:var(--brand)}.s1 .si{color:var(--accent-d)}
.s2{background:var(--sun);color:var(--brand)}.s2 .si{color:var(--accent-d)}
.s3{background:var(--brand);color:#fff}.s3 .si{color:var(--brand)}.s3 .pp i{background:var(--accent);color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0;box-shadow:0 4px 14px rgba(11,42,91,.06)}
.tile{position:relative;aspect-ratio:1/1;display:grid;place-items:center}
.tile svg.pic{width:56%;height:56%}
.t0{background:var(--soft);color:var(--accent)}
.t1{background:var(--sky);color:var(--brand)}
.t2{background:var(--sun);color:var(--accent-d)}
.badge{position:absolute;top:10px;left:10px;background:var(--accent);color:var(--brand);font-weight:800;font-size:12px;border-radius:999px;padding:4px 9px}
.badge.alt{background:var(--brand);color:#fff}
.cbody{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px;flex:1}
.rate{font-size:12px;font-weight:800;color:var(--accent-d)}.rate span{color:var(--muted);font-weight:600}
.cbody .nm{font-weight:800;font-size:14px;line-height:1.25}
.cbody .un{color:var(--muted);font-size:12px}
.pr{margin-top:auto;padding-top:6px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price{font-family:var(--font-display);font-weight:700;font-size:17px;color:var(--brand)}
.old{color:var(--muted);text-decoration:line-through;font-size:12px}
.add{border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;border-radius:12px;padding:10px;margin-top:8px;display:flex;justify-content:center;align-items:center;gap:6px;box-shadow:0 3px 0 var(--accent-d)}
.add:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-d)}
.empty{color:var(--muted);text-align:center;padding:32px 8px;grid-column:1/-1}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px;margin-block:12px}
label.f{display:grid;gap:6px;font-weight:700;font-size:14px}
.in{border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;width:100%;font-size:16px}
.in:focus{border-color:var(--accent);outline:0}
.opts{display:grid;gap:8px}
.opt{display:flex;justify-content:space-between;gap:10px;align-items:center;border:2px solid var(--line);background:#fff;border-radius:14px;padding:11px 12px;text-align:left;width:100%}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.opt b{font-family:var(--font-display);font-weight:600}
.svcopt{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.svcopt .si{width:48px;height:48px;border-radius:14px;display:grid;place-items:center}
.svcopt .si svg{width:28px;height:28px}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.slot{border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 0;font-weight:800;text-align:center}
.slot[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.slot small.vg{display:block;font-size:10px;font-weight:800;color:var(--accent-d);margin-top:1px}
.slot[aria-pressed="true"] small.vg{color:var(--brand)}
.slot:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.primary{border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;border-radius:14px;padding:14px;width:100%;font-size:16px;box-shadow:0 4px 0 var(--accent-d)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.ghost{border:2px solid var(--line);background:transparent;border-radius:10px;padding:7px 12px;font-weight:700}
.chip{flex:none;border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:700;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:4px;scrollbar-width:none}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}
.muted{color:var(--muted);font-size:13px}
.hist{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:6px;margin-bottom:10px;box-shadow:0 4px 14px rgba(11,42,91,.05)}
.pill{font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;background:var(--sky);color:var(--brand)}
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);gap:4px;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.bar button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:6px;color:var(--muted);font-weight:800;font-size:11px;border-radius:14px}
nav.bar button[aria-current="page"]{color:var(--accent-d);background:var(--soft)}
nav.bar svg{width:22px;height:22px}
.scrim{position:fixed;inset:0;background:rgba(11,42,91,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88%;overflow:auto;background:#fff;border-radius:24px 24px 0 0;
  padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));
  max-width:640px;margin-inline:auto;display:grid;gap:14px}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:32px;height:32px;border-radius:50%;border:2px solid var(--accent);background:#fff;font-weight:800;color:var(--accent-d)}
.total{font-family:var(--font-display);font-size:24px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--brand);color:#fff;padding:10px 18px;border-radius:999px;z-index:30;font-weight:800;max-width:90%;text-align:center}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:16px}
@media (min-width:520px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (prefers-reduced-motion:no-preference){.card,.svc{transition:transform .15s}.card:active,.svc:active{transform:scale(.98)}}

/* Área de gestão */
.brandact{display:flex;align-items:center;gap:8px}
.admbtn{border:2px solid var(--brand);background:#fff;color:var(--brand);border-radius:999px;padding:7px 12px;font-weight:800;font-size:13px}
.pimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badge.out{background:var(--brand);color:#fff;left:auto;right:10px}
.stock-note{font-size:12px;font-weight:800;color:var(--danger)}
.add:disabled{opacity:.5;box-shadow:none;cursor:not-allowed}
.empty-card{background:var(--soft);border-radius:var(--r);padding:22px;text-align:center;display:grid;gap:10px;justify-items:center;margin-block:16px}
.empty-card h2{font-size:20px}
body.adm{background:#F1F5FB;max-width:1040px}
body.adm::before{background:#F1F5FB}
.atop{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--brand);color:#fff;border-radius:16px;padding:10px 14px;margin-top:10px}
.atop .ab{display:flex;align-items:center;gap:10px;min-width:0}
.atop .ab img{height:30px;width:auto;background:#fff;border-radius:8px;padding:2px 6px;display:block}
.atop b{font-family:var(--font-display);font-size:18px}
.atop button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 14px;font-weight:800;white-space:nowrap}
.atabs{display:flex;gap:6px;overflow-x:auto;padding-block:12px 8px;scrollbar-width:none}
@media (hover:hover) and (pointer:fine){
  .atabs,.cats{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .atabs::-webkit-scrollbar,.cats::-webkit-scrollbar{height:8px}
  .atabs::-webkit-scrollbar-thumb,.cats::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px}
  .atabs::-webkit-scrollbar-thumb:hover,.cats::-webkit-scrollbar-thumb:hover{background:var(--muted)}
}
.atab{flex:none;border:0;border-radius:999px;padding:9px 15px;font-weight:800;background:#fff;color:var(--brand);box-shadow:0 1px 0 var(--line)}
.atab[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.acard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;margin-bottom:10px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}

.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:2px}

.kpi b{font-family:var(--font-display);font-size:26px;color:var(--brand)}
.kpi.hot{background:var(--accent);border-color:var(--accent)}
.kpi.hot span,.kpi.hot b{color:var(--accent-ink)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar .in{flex:1;min-width:160px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;border-radius:12px;padding:10px 16px;box-shadow:0 3px 0 var(--accent-d)}
.btn.alt{background:var(--brand);color:#fff;box-shadow:none}
.btn.line{background:#fff;color:var(--brand);border:2px solid var(--line);box-shadow:none}
.btn.danger{background:#fff;color:var(--danger);border:2px solid var(--danger);box-shadow:none}
.mini{border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;font-weight:800;color:var(--brand)}
.arow{display:grid;grid-template-columns:56px minmax(0,1fr);gap:6px 12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.arow .main{min-width:0}
.athumb.tap{position:relative;cursor:pointer}

.arow .main b{display:block;overflow-wrap:anywhere}
.arow .ctl{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-top:1px dashed var(--line);padding-top:10px}
.prodmore{display:flex;justify-content:center;padding:6px 0 12px}
.mpov{position:fixed;inset:0;z-index:40;background:rgba(11,42,91,.55);display:grid;place-items:center;padding:16px}
.mpcard{background:#fff;border-radius:20px;padding:18px;max-width:380px;width:100%;display:grid;gap:12px;max-height:92vh;overflow:auto;text-align:center}
.mpcard .mphd{display:flex;justify-content:space-between;align-items:center}
.mpcard .mphd b{font-family:var(--font-display);font-size:19px}
.mpqr{width:220px;height:220px;margin:0 auto;border:1px solid var(--line);border-radius:12px;object-fit:contain}
.mpcc{display:flex;gap:8px}.mpcc .in{font-size:13px;min-width:0}.mpcc .btn{flex:none}
.mpwait{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--muted);font-weight:800}
.mpspin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:mpsp 1s linear infinite;flex:none}
@keyframes mpsp{to{transform:rotate(360deg)}}
.mpok .mpcheck{width:64px;height:64px;border-radius:50%;background:#1D7F53;color:#fff;font-size:36px;display:grid;place-items:center;margin:0 auto}
.delbar{display:flex;align-items:center;gap:11px;background:linear-gradient(135deg,#FFF3E6,#FFE2C2);border:1px solid #FFD2A1;border-radius:14px;padding:11px 13px;margin-bottom:12px}

.lgfoot{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;margin:22px 0 6px;color:var(--muted);font-size:13px}

.lgfv{font-weight:800;opacity:.8;text-decoration:none}
.lgcard{text-align:left;max-width:440px}
.lgcard .lgtabs{display:flex;gap:6px}

.lgcard .lgtab.on{background:var(--accent);color:#fff}
.lgcard .lgbody{font-size:14px;line-height:1.5;color:var(--ink);max-height:70vh;overflow:auto}
.lgcard .lgbody h4{margin:14px 0 4px;font-size:14px}
.lgcard .lgbody p{margin:0 0 6px}
.lgcard .lgd{color:var(--muted);font-size:12px;margin-bottom:10px}
.iosins{text-align:left;margin:0;padding-left:20px;line-height:1.7;font-size:14px}

.lojacard .lojahd b{font-family:var(--font-display);font-size:18px;display:block}

.ftab td,.ftab th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.ftab th{font-size:12px;color:var(--muted)}
.stars{color:#F2A900;letter-spacing:1px;font-size:15px}
.stars.big{font-size:22px}
.rev{border-top:1px solid var(--line);padding:10px 0;display:grid;gap:3px}
.revsum{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.revsum b{font-family:var(--font-display);font-size:30px;color:var(--brand)}
.pv-rate{border:0;background:none;padding:0;margin-top:6px;display:flex;gap:6px;align-items:center;font-weight:800;color:var(--muted);font-size:13px}
.starpick{display:flex;gap:6px;justify-content:center}
.starpick button{border:0;background:none;font-size:38px;color:var(--line);padding:0;line-height:1}
.starpick button[aria-pressed="true"]{color:#F2A900}
.shipbar{background:var(--soft);border-radius:14px;padding:10px 12px;display:grid;gap:6px;font-size:13px;font-weight:700}
.shipbar.ok{background:#DDF4E4;color:#12663A}
.cartx .hscroll{margin-inline:0;padding-inline:0}
.cartx{margin-top:2px}
.cartx .hscroll{gap:8px;scroll-snap-type:none;scroll-behavior:auto}
.cartx .hscroll .card{width:42%;min-width:128px;max-width:150px}
.cartx .hscroll .card .tile{aspect-ratio:auto;height:104px}
.cartx .hscroll .card .tile svg.pic{width:46%;height:46%}
.cartx .hscroll .cbody{padding:6px 8px 8px;gap:2px}
.cartx .hscroll .cbody .nm{font-size:12.5px!important;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cartx .hscroll .price{font-size:14.5px}
.cartx .hscroll .add{padding:7px;font-size:12.5px;margin-top:4px;box-shadow:0 2px 0 var(--accent-d)}
.tl{display:flex;margin:6px 0 2px}
.tl span{flex:1;display:grid;justify-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--muted);text-align:center;position:relative;line-height:1.15}
.tl span::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--line);z-index:1}
.tl span::after{content:"";position:absolute;top:6px;left:-50%;width:100%;height:3px;background:var(--line)}
.tl span:first-child::after{display:none}
.tl span.on{color:var(--brand)}.tl span.on::before{background:var(--accent)}.tl span.on::after{background:var(--accent)}
.tl span.now::before{box-shadow:0 0 0 4px rgba(255,122,0,.25)}
.refcard{background:linear-gradient(140deg,#0B2A5B,#1D4E9E);color:#fff;border-radius:var(--r);padding:16px;display:grid;gap:8px;margin-top:14px}
.refcard h3{font-size:20px}.refcard .code{font-family:var(--font-display);font-size:26px;letter-spacing:.06em;background:rgba(255,255,255,.12);border-radius:12px;padding:8px 12px;justify-self:start}
.refcard .apact .ghost{color:#fff;border-color:rgba(255,255,255,.35)}
.refcard .walink{background:#25D366;color:#fff;border-color:#25D366}
.plan{display:grid;gap:4px;text-align:left}
.plan .pz{font-family:var(--font-display);font-size:20px;color:var(--brand)}
.alert{background:#FCE0DA;color:#A8321F;border-radius:12px;padding:8px 10px;font-weight:800;font-size:13px}
.rbars{display:flex;align-items:flex-end;gap:2px;height:140px;padding-top:8px;border-bottom:1px solid var(--line)}
.rbars i{flex:1;min-width:2px;background:var(--accent);border-radius:4px 4px 0 0;position:relative}
.rbars i:hover{background:var(--accent-d)}
.raxis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:13px;margin-top:6px}
.hbar .tr{grid-column:1/-1;height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--accent);border-radius:999px}
.rtab{width:100%;border-collapse:collapse;font-size:13px}
.rtab th,.rtab td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.rtab th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.rtab td.n,.rtab th.n{text-align:right;white-space:nowrap}
.phero .art{position:absolute;right:-8px;bottom:-12px;width:128px;height:128px;color:rgba(255,255,255,.9)}
.quickgrid{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:14px -16px 6px;padding:2px 16px 6px;scroll-snap-type:x proximity}
.quickgrid::-webkit-scrollbar{display:none}
.qtile{flex:none;width:76px;border:0;background:var(--sky);border-radius:14px;padding:10px 6px;display:grid;justify-items:center;gap:5px;color:var(--brand);font-weight:800;font-size:11.5px;text-align:center;line-height:1.15;scroll-snap-align:start}
.qtile:nth-child(3n-1){background:var(--soft);color:var(--accent-d)}
.qtile:nth-child(3n){background:var(--sun);color:#7A4A00}
.qtile .qi{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.75);display:grid;place-items:center}
.qtile .qi svg{width:20px;height:20px}
.brands{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px 8px;scroll-snap-type:x proximity}
.brands::-webkit-scrollbar{display:none}
.brandcard{flex:none;width:118px;height:76px;border:1px solid var(--line);border-radius:16px;background:#fff;display:grid;place-items:center;padding:10px;scroll-snap-align:start;box-shadow:0 4px 14px rgba(11,42,91,.05);overflow:hidden}
.brandcard img{max-width:100%;max-height:100%;object-fit:contain}
.brandcard b{font-family:var(--font-display);font-weight:700;color:var(--brand);font-size:16px;text-align:center;line-height:1.1;overflow-wrap:anywhere}
.bradm{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.bradm:first-of-type{border-top:0}
.bradm .lg{width:64px;height:44px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;background:#fff;overflow:hidden;flex:none}
.bradm .lg img{max-width:100%;max-height:100%;object-fit:contain}
.bradm .lg span{font-size:11px;color:var(--muted)}
/* Cupom gerencial (bobina 80mm) */
#printSlip{display:none}
@media print{
  body{visibility:hidden}
  #printSlip,#printSlip *{visibility:visible}
  #printSlip{display:block;position:absolute;left:0;top:0;width:72mm;color:#000;background:#fff;font-family:'Arial Black','Arial',ui-monospace,monospace;font-size:15px;font-weight:700;line-height:1.45;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:80mm auto;margin:3mm}
}
#printSlip{font-weight:700}
#printSlip .ph{text-align:center}
#printSlip .ph b{font-size:24px;letter-spacing:1px;font-weight:800}
#printSlip .big{font-size:19px;font-weight:800}
#printSlip hr{border:0;border-top:2px solid #000;margin:7px 0}
#printSlip .it{display:flex;gap:9px;align-items:flex-start;margin:7px 0}
#printSlip .it .bx{width:20px;height:20px;border:2.5px solid #000;flex:none;margin-top:2px}
#printSlip .it .q{font-size:22px;font-weight:800;min-width:30px}
#printSlip .it .nm{flex:1;font-size:16px}
#printSlip .row{display:flex;justify-content:space-between;gap:10px}
#printSlip .mut{font-size:13px;font-weight:700}
/* Balcão / retaguarda */
.mbres{border:1px solid var(--line);border-radius:12px;max-height:240px;overflow:auto;margin-top:6px}
.mbres button{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;background:#fff;border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;font:inherit;color:var(--brand)}
.mbres button:last-child{border-bottom:0}
.mbres button:hover{background:var(--soft)}
.mbres .pz{font-weight:800;white-space:nowrap}
.mbt{width:100%;border-collapse:collapse;min-width:620px;font-size:14px}
.mbt th,.mbt td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.mbt th:first-child,.mbt td:first-child{text-align:left;white-space:normal;min-width:160px}
.mbt th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.mbt input{width:88px;border:2px solid var(--line);border-radius:8px;padding:6px 8px;text-align:right}
.mbt .stk{justify-content:flex-end}
.lucpos{color:#12663A;font-weight:800}.lucneg{color:var(--danger);font-weight:800}
.mbtot{display:grid;gap:4px;margin-top:12px;background:var(--soft);border-radius:14px;padding:14px}
.mbtot .row b{font-family:var(--font-display)}
.mbtot .grand{font-size:20px}
</style>

<script>
/* ================= CAIXA (PDV) + regras únicas do clube =================
   O saldo de cada cliente fica em wallet/<id> como uma lista de movimentos (mov).
   Loja e app gravam ali; pontos, cashback (com validade) e nível são sempre calculados da lista. */
(function(){
'use strict';
const DAY = 864e5;
const r2 = v => Math.round((+v || 0) * 100) / 100;
const numv = v => { const n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isNaN(n) ? 0 : n; };
const TIERS_DEF = [{n:'Bronze', min:0, pct:2}, {n:'Prata', min:500, pct:3}, {n:'Ouro', min:1500, pct:5}];

/* ---------- regras compartilhadas (usadas pelo app e pelo caixa) ---------- */
const FID = window.FID = {};
FID.conf = st => {
  st = st || {};
  const t = Array.isArray(st.tiers) && st.tiers.length ? st.tiers : TIERS_DEF;
  return {
    ptsPorReal: st.ptsPerReal != null && st.ptsPerReal !== '' ? numv(st.ptsPerReal) : 1,
    validadeDias: st.cbVal != null && st.cbVal !== '' ? numv(st.cbVal) : 90,
    maxUsoPct: st.cbMax != null && st.cbMax !== '' ? numv(st.cbMax) : 100,
    minCompraUso: st.cbMin != null && st.cbMin !== '' ? numv(st.cbMin) : 0,
    bonusIndicador: st.bInd != null && st.bInd !== '' ? numv(st.bInd) : 10,
    bonusIndicado: st.bIdo != null && st.bIdo !== '' ? numv(st.bIdo) : 10,
    niveis: t.map(x => ({nome:String(x.n || ''), min:numv(x.min), cb:numv(x.pct)})).sort((a, b) => a.min - b.min)
  };
};
FID.nivel = (conf, gasto) => { const nv = conf.niveis.map((n, i) => ({...n, idx:i})); let cur = nv[0]; for (const n of nv) if (gasto >= n.min) cur = n; return cur; };
FID.legacy = w => {
  if (!w) return [];
  if (Array.isArray(w.mov)) return w.mov;
  const pts = Math.floor(numv(w.points)), cash = r2(numv(w.cash)), life = Math.floor(numv(w.life));
  if (!pts && !cash && !life) return [];
  const ts = (w.log || []).reduce((a, l) => Math.max(a, numv(l.ts)), 0) || Date.now();
  return [{id:'saldo-anterior', t:'saldo', data:new Date(ts).toISOString(), desc:'Saldo anterior do clube', pts, cbGerado:cash, gasto:life, canal:'app'}];
};
FID.stats = (mov, conf, now) => {
  now = now || Date.now();
  const v = +conf.validadeDias || 0, movs = [...(mov || [])].sort((a, b) => a.data < b.data ? -1 : 1);
  const lots = []; let pts = 0, gasto12 = 0, gastoTot = 0, compras = 0, ultima = null, primeira = null;
  for (const m of movs) {
    const t = Date.parse(m.data);
    if (m.cbUsado > 0) { let r = m.cbUsado; for (const l of lots) { if (l.exp && l.exp < t) continue; const u = Math.min(l.rest, r); l.rest = r2(l.rest - u); r = r2(r - u); if (r <= 0) break; } }
    if (m.cbGerado > 0) lots.push({rest:m.cbGerado, exp: v ? t + v * DAY : 0});
    pts += (m.pts || 0) - (m.ptsUsados || 0);
    const g = (m.t === 'compra' ? numv(m.pago) : 0) + numv(m.gasto);
    if (g) { gastoTot += g; if (now - t < 365 * DAY) gasto12 += g; }
    if (m.t === 'compra') { if (numv(m.pago) > 0) { compras++; ultima = m.data; primeira = primeira || m.data; } else if (numv(m.pago) < 0) compras = Math.max(0, compras - 1); }
  }

function calc() {
  const c = pdv.clienteId ? S.clientes.get(pdv.clienteId) : null, s = c ? stats(c) : null, conf = cfg();
  const valor = parseMoney(pdv.valor), desconto = Math.min(parseMoney(pdv.desconto), valor), base = r2(valor - desconto);
  const minOk = base >= (+conf.minCompraUso || 0);
  const maxCb = s && minOk ? r2(Math.min(s.saldo, base * (+conf.maxUsoPct || 0) / 100)) : 0;
  const pedido = parseMoney(pdv.usarCb), usar = Math.min(pedido, maxCb), total = r2(base - usar);
  const b = c ? FID.bonus(campanhas(), s.nivel.nome, c.aniversario) : {mult:1, extra:0, multPts:1, nomes:[]};
  const camps = c ? campAtivas(c, s) : [];
  const pctBase = s ? s.nivel.cb : 0, pct = c ? r2(pctBase * b.mult + b.extra) : 0;
  const cbGanho = c ? r2(total * pct / 100) : 0, pts = c ? Math.floor(total * (+conf.ptsPorReal || 0) * b.multPts) : 0;
  const recebido = parseMoney(pdv.recebido), troco = pdv.forma === 'dinheiro' && recebido ? r2(recebido - total) : null;
  return {c, s, valor, desconto, base, minOk, maxCb, pedido, usar, total, pctBase, pct, cbGanho, pts, camps, recebido, troco};
}

function readClienteForm(f, existing) {
  const fd = new FormData(f), tel = digits(fd.get('telefone')), nome = String(fd.get('nome') || '').trim();
  if (!nome) { toast('Informe o nome do cliente', true); return null; }
  if (tel.length < 10) { toast('Telefone com DDD, ex.: (11) 98765-4321', true); return null; }
  const dup = clientes().find(c => digits(c.telefone) === tel && (!existing || c.id !== existing.id));
  if (dup) { toast(`Já existe cliente com esse telefone: ${dup.nome}${dup.origem === 'app' ? ' (cadastrado no app)' : ''}`, true); return null; }
  const c = {...(existing ? clone(existing) : {id:'loja-' + newId(), origem:'loja', criadoEm:new Date().toISOString(), mov:[], notas:[]}),
    nome, telefone:tel, email:String(fd.get('email') || '').trim(), cpf:digits(fd.get('cpf')), aniversario:fd.get('aniversario') || '',
    tags:String(fd.get('tags') || '').split(',').map(t => t.trim()).filter(Boolean), obs:String(fd.get('obs') || '').trim()};
  if (fd.has('indicadoPor')) {
    const v = String(fd.get('indicadoPor') || '').trim();
    if (!v) delete c.indicadoPor;
    else {
      const d = digits(v.split('·')[1] || ''), nv = norm(v.split('·')[0]).trim();
      const cands = clientes().filter(x => x.id !== c.id && (d.length >= 10 ? digits(x.telefone) === d : norm(x.nome) === nv));
      if (cands.length !== 1) { toast('Não encontrei quem indicou. Escolha um nome da lista de sugestões.', true); return null; }
      c.indicadoPor = cands[0].id;
    }
  }
  return c;
}

function chartHtml() {
  const vs = vendasTodas(), now = new Date(), keys = [], labels = [], fullLbl = [];
  if (ui.chart === 'dias') { for (let i = 29; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i); keys.push(dayKey(d)); labels.push(i % 5 === 0 ? d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'}) : ''); fullLbl.push(d.toLocaleDateString('pt-BR', {weekday:'short', day:'2-digit', month:'2-digit'})); } }
  else { for (let i = 11; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); keys.push(dayKey(d).slice(0, 7)); labels.push(d.toLocaleDateString('pt-BR', {month:'short'}).replace('.', '')); fullLbl.push(d.toLocaleDateString('pt-BR', {month:'long', year:'numeric'})); } }
  const idx = new Map(keys.map((k, i) => [k, i])), val = keys.map(() => 0), cnt = keys.map(() => 0);
  for (const v of vs) { const k = ui.chart === 'dias' ? dayKey(v.data) : dayKey(v.data).slice(0, 7); if (idx.has(k)) { val[idx.get(k)] += v.pago; cnt[idx.get(k)]++; } }
  const max = Math.max(...val, 0);
  const step = (() => { if (!max) return 100; const raw = max / 3, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; })();
  const top = step * Math.max(1, Math.ceil(max / step)), ticks = []; for (let t = 0; t <= top + 1e-9; t += step) ticks.push(t);

      <div class="plot">${ticks.slice(1).map(t => `<div class="gl" style="bottom:${t / top * 100}%"></div>`).join('')}
        <div class="bars">${val.map((v, i) => `<button class="b" type="button" data-tip="${esc(fullLbl[i])}: ${esc(money(v))} · ${plural(cnt[i], 'venda', 'vendas')}" aria-label="${esc(fullLbl[i])}: ${esc(money(v))}"><i style="height:${v / top * 100}%"></i></button>`).join('')}</div>
        <div id="tip" hidden></div></div>
      <div class="xax">${labels.map(l => `<span>${esc(l)}</span>`).join('')}</div>
    </div>`}`;
}

      <div class="row"><span class="chip" style="font-size:14px">${nfmt(p.pontos)} pts</span>${pode ? `<button class="btn sm" data-act="pr-edit" data-p="${p.id}">Editar</button>${confirmBtn('delpr-' + p.id, 'Excluir', 'pr-del', `data-p="${p.id}"`)}` : ''}</div></div>`; }).join('')}</div>` :
      `<div class="card empty"><b>Nenhum prêmio cadastrado</b><span>Crie prêmios (produtos, serviços ou cashback) que o cliente pode trocar pelos pontos.</span></div>`}
  </div>
  <div class="card"><h3>Últimas trocas</h3>${resg.length ? `<div class="list">${resg.slice(0, 30).map(r => `<div class="item"><div class="t"><b>${esc(r.premio || r.desc || 'Prêmio')}</b><div class="small muted">${esc(r.nome)} · ${fmtDT(r.data)} · ${r.canal === 'loja' ? 'loja' : 'app'}${r.op ? ' · ' + esc(r.op) : ''}</div></div><span class="neg">−${r.ptsUsados || 0} pts</span></div>`).join('')}</div>` : '<div class="note info">Nenhuma troca feita ainda.</div>'}</div></div>`;
}

        ${t && G ? `<form data-form="tpl" class="card" style="background:var(--sunk)"><h3>${ui.tplSel === 'novo' ? 'Novo modelo' : 'Editar modelo'}</h3>

          <label class="f">Texto *<textarea name="texto" id="tpl-txt" rows="7" required>${esc(t.texto)}</textarea></label>
          <div class="small muted">Toque para inserir no texto. São trocadas pelos dados de cada cliente:</div>
          <div class="vars">${VARS.map(v => `<button type="button" data-act="ins-var" data-v="${v}">{${v}}</button>`).join('')}</div>
          <div class="row"><button class="btn pri">Salvar modelo</button><button type="button" class="btn ghost" data-act="tpl-cancel">Cancelar</button></div></form>` : ''}
        ${ts.length ? ts.map(m => `<div class="tpl"><div class="row between"><b>${esc(m.titulo)}</b><span class="chip">${esc(GATILHOS[m.gatilho] || 'Livre')}</span></div><p>${esc(m.texto)}</p>
          <div class="row">${G ? `<button class="btn sm" data-act="tpl-edit" data-t="${m.id}">Editar</button>` : ''}<button class="btn sm" data-act="tpl-usar" data-t="${m.id}">Enviar para grupo</button>${G ? confirmBtn('deltpl-' + m.id, 'Excluir', 'tpl-del', `data-t="${m.id}"`) : ''}</div></div>`).join('') :
          `<div class="card empty"><b>Nenhum modelo de mensagem</b><span>Carregue os modelos prontos ou crie o seu.</span>${G ? '<button class="btn pri" data-act="tpl-padrao">Carregar modelos prontos</button>' : ''}</div>`}
      </div>
      <div class="card sticky" id="envio">
        <h3>Enviar para um grupo</h3>
        <div class="fields"><label class="f">Grupo de clientes<select id="envio-seg">${segs.map(s => `<option value="${s.id}" ${s.id === sg.id ? 'selected' : ''}>${esc(s.nome)} (${s.itens.length})</option>`).join('')}</select></label>
        <label class="f">Modelo<select id="envio-tpl">${ts.map(m => `<option value="${m.id}" ${et && m.id === et.id ? 'selected' : ''}>${esc(m.titulo)}</option>`).join('')}</select></label></div>
        ${et && ex ? `<div class="small muted">Prévia com ${esc(firstName(ex.nome))}:</div><div class="bubble">${esc(fill(et.texto, ex))}</div>` : ''}
        ${!et ? '<div class="note info">Crie um modelo de mensagem primeiro.</div>' : sg.itens.length ? `<div class="list">${sg.itens.map(x => { const txt = fill(et.texto, x.c); return `<div class="item"><div class="t"><b>${esc(x.c.nome)}</b><div class="small muted">${esc(fmtPhone(x.c.telefone))}${(x.c.notas || []).some(n => n.tipo === 'msg' && n.texto.includes(et.titulo) && daysAgo(n.data) < 7) ? ' · <span class="pos">aberto nesta semana</span>' : ''}</div></div><a class="btn sm wa" href="${esc(waLink(x.c.telefone, txt))}" target="_blank" rel="noopener" data-act="wa-log" data-c="${x.c.id}" data-tit="${esc(et.titulo)}">WhatsApp</a></div>`; }).join('')}</div>
          <p class="small muted">O WhatsApp não permite envio automático em massa por aqui: cada botão abre a conversa com o texto pronto, é só tocar em enviar.</p>` : '<div class="note info">Nenhum cliente neste grupo agora.</div>'}
      </div>
    </div>`;
}

  return `<div class="grid2">

      </div>
      <div><h3>Bônus de indicação</h3><p class="small muted" style="margin-top:4px">Pago em cashback quando o cliente indicado faz a primeira compra, na loja ou no app. Use 0 para desligar.</p></div>
      <div class="fields">
        <label class="f">Quem indicou ganha (R$)<input type="number" name="bonusIndicador" id="cfg-bir" min="0" step="1" value="${esc(c.bonusIndicador)}" ${dis}></label>
        <label class="f">Quem foi indicado ganha (R$)<input type="number" name="bonusIndicado" id="cfg-bid" min="0" step="1" value="${esc(c.bonusIndicado)}" ${dis}></label>

      <div class="tbl lvtbl"><table><thead><tr><th>Nível</th><th>Gasto em 12 meses (R$)</th><th>Cashback (%)</th></tr></thead><tbody>
        ${c.niveis.map((n, i) => `<tr><td><input type="text" name="nv${i}nome" id="nv${i}nome" value="${esc(n.nome)}" ${dis}></td><td><input type="number" name="nv${i}min" id="nv${i}min" min="0" step="1" value="${esc(n.min)}" ${i === 0 || !pode ? 'readonly' : ''}></td><td><input type="number" name="nv${i}cb" id="nv${i}cb" min="0" max="50" step="0.5" value="${esc(n.cb)}" ${dis}></td></tr>`).join('')}
      </tbody></table></div>
      ${pode ? '<div><button class="btn pri">Salvar regras</button></div>' : ''}
    </form>
    <div class="col">
      <div class="card"><h3>Equipe do caixa</h3>
        ${ms.length ? `<p class="small muted">Cada pessoa entra com o próprio PIN. <b>Caixa</b> vende, cadastra clientes e troca pontos. <b>Gerente</b> também cancela vendas, ajusta saldos, exclui clientes e altera regras, campanhas, prêmios e mensagens.</p>`
          : `<div class="note info">Ninguém cadastrado: hoje qualquer pessoa da equipe faz tudo. Cadastre a equipe para registrar quem atendeu cada venda e limitar o que o caixa pode fazer. Comece por você, como gerente.</div>`}
        ${ms.length ? `<div class="list">${ms.map(m => `<div class="item"><div class="t"><b>${esc(m.nome)}</b> <span class="chip ${m.papel === 'gerente' ? 'hot' : ''}">${m.papel === 'gerente' ? 'Gerente' : 'Caixa'}</span></div>${podeEquipe ? confirmBtn('delm-' + m.id, 'Remover', 'membro-del', `data-m="${m.id}"`) : ''}</div>`).join('')}</div>` : ''}
        ${podeEquipe ? (ui.membroNovo ? `<form data-form="membro" class="card" style="background:var(--sunk)"><div class="fields">
            <label class="f">Nome *<input type="text" name="nome" id="mb-nome" required></label>
            <label class="f">Função<select name="papel" id="mb-papel"><option value="caixa">Caixa</option><option value="gerente" ${!temGer ? 'selected' : ''}>Gerente</option></select></label>
            <label class="f">PIN (4 a 8 números) *<input type="password" inputmode="numeric" name="pin" id="mb-pin" minlength="4" maxlength="8" required autocomplete="new-password"></label></div>

        ${ui.exportTxt ? `<textarea id="bk-text" rows="5" readonly>${esc(ui.exportTxt)}</textarea><div><button class="btn sm" data-act="bk-copy">Copiar</button></div>` : ''}

const backupJson = () => JSON.stringify({app:'gatecao-caixa', versao:3, exportadoEm:new Date().toISOString(), regras:R.settings, clientes:clientes(), campanhas:[...S.campanhas.values()], fechamentos:[...S.fechamentos.values()], vendasSemCadastro:[...S.avulsas.values()], mensagens:[...S.mensagens.values()], premios:[...S.premios.values()]});

/* ---------- modo consulta ---------- */
function abrirTotem() { Object.assign(totem, {on:true, tel:'', cid:null, sair:false}); $('#totem').hidden = false; renderTotem(); }
function fecharTotem() { totem.on = false; clearTimeout(totem.timer); $('#totem').hidden = true; $('#totem').innerHTML = ''; if (location.hash === '#caixa-consulta') location.hash = 'caixa'; }
function totemReset(ms) { clearTimeout(totem.timer); totem.timer = setTimeout(() => { Object.assign(totem, {tel:'', cid:null, sair:false}); if (totem.on) renderTotem(); }, ms); }
function totemBuscar() {
  const d = digits(totem.tel); if (d.length < 8) return toast('Digite o telefone com DDD', true);
  const m = clientes().filter(c => digits(c.telefone) === d || digits(c.telefone).endsWith(d.slice(-8)));
  totem.cid = m.length === 1 ? m[0].id : 'nao'; renderTotem(); totemReset(25000);
}
function renderTotem() {
  const el = $('#totem'), c = totem.cid && totem.cid !== 'nao' ? S.clientes.get(totem.cid) : null, conf = cfg(), ger = equipe().filter(m => m.papel === 'gerente');
  const sair = totem.sair ? `<form data-form="totem-sair" class="row" style="justify-content:flex-end"><input type="password" inputmode="numeric" id="tt-pin" name="pin" placeholder="PIN do gerente" style="width:160px;background:#fff;color:#0B2A5B"><button class="texit">Sair</button><button type="button" class="texit" data-act="tt-sair-cancel">Cancelar</button></form>`
    : `<button class="texit" data-act="tt-sair">Sair do modo consulta</button>`;
  let res;
  if (c) {
    const s = stats(c), ps = premios(), prox = ps.find(p => p.pontos > s.pts), pode = ps.filter(p => p.pontos <= s.pts);
    const nx = conf.niveis.map((n, i) => ({...n, idx:i})).filter(n => n.min > s.gasto12).sort((a, b) => a.min - b.min)[0], ks = campAtivas(c, s);
    res = `<div class="tcard">
      <div><div style="font-size:22px;font-weight:800">Olá, ${esc(firstName(c.nome))}!</div><span class="chip lv-${Math.min(s.nivel.idx, 3)}">Cliente ${esc(s.nivel.nome)} · ${nfmt(s.nivel.cb)}% de cashback</span></div>
      <div class="fields"><div><div class="eyebrow">Seu cashback</div><div class="big">${money(s.saldo)}</div>${s.vencendo ? `<div class="small" style="color:#9A5B00;font-weight:700">${money(s.vencendo)} vence em ${fmtDate(s.vencData)}</div>` : ''}</div><div><div class="eyebrow">Seus pontos</div><div class="big pts">${nfmt(s.pts)}</div></div></div>
      ${pode.length ? `<div class="note good">Você já pode trocar por: <b>${esc(pode.map(p => p.nome).join(', '))}</b>. Peça no caixa!</div>` : ''}
      ${prox ? `<div style="display:grid;gap:6px"><span class="small"><b>Faltam ${nfmt(prox.pontos - s.pts)} pontos</b> para ${esc(prox.nome)}</span><div class="prog"><i style="width:${Math.min(100, s.pts / prox.pontos * 100)}%"></i></div></div>` : ''}
      ${nx ? `<span class="small">Gaste mais ${money(nx.min - s.gasto12)} em 12 meses e vire <b>${esc(nx.nome)}</b> (${nfmt(nx.cb)}% de cashback).</span>` : ''}
      ${ks.length ? `<div class="note hot"><b>Hoje para você:</b> ${ks.map(k => `${esc(k.nome)} (${esc(campDesc(k))})`).join(', ')}</div>` : ''}
      <span class="small">${c.origem === 'app' ? 'Você também acompanha tudo pelo app da Gatecão.' : 'Baixe o app da Gatecão e entre com este telefone para ver seu saldo e resgatar prêmios por lá.'}</span>
      <button class="btn pri xl" data-act="tt-limpar">Pronto</button></div>`;
  } else if (totem.cid === 'nao') {
    res = `<div class="tcard"><b style="font-size:20px">Não encontramos esse telefone.</b><span>Confira o número ou peça ao atendente para fazer seu cadastro. Leva menos de um minuto e você já começa a ganhar cashback.</span><button class="btn pri xl" data-act="tt-limpar">Tentar de novo</button></div>`;
  } else {
    res = `<div class="tcard"><b style="font-size:20px">Como funciona</b><span>A cada compra, na loja ou no app, você ganha <b>${nfmt(conf.niveis[0].cb)}% a ${nfmt(conf.niveis[conf.niveis.length - 1].cb)}% de volta</b> em cashback para usar como desconto, e ${nfmt(conf.ptsPorReal)} ponto por real para trocar por prêmios.</span>
      ${premios().length ? `<div class="prizes">${premios().slice(0, 4).map(p => `<div class="prize" style="background:#EEF3FA;color:#0B2A5B"><b>${esc(p.nome)}</b><span class="p">${nfmt(p.pontos)} pts</span></div>`).join('')}</div>` : ''}</div>`;
  }
  el.innerHTML = `<div class="tt">${sair}
    <div><h1>Consulte seu cashback</h1><p class="lead">Digite seu telefone com DDD para ver seu saldo e seus pontos no clube ${esc(conf.loja)}.</p></div>
    <div class="tgrid"><div style="display:grid;gap:12px">
        <div class="tdisp" aria-live="polite">${totem.tel ? esc(fmtPhone(totem.tel) || totem.tel) : '<span style="opacity:.45">(11) 9____-____</span>'}</div>
        <div class="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-act="tt-key" data-k="${n}">${n}</button>`).join('')}<button data-act="tt-key" data-k="del" aria-label="Apagar">⌫</button><button data-act="tt-key" data-k="0">0</button><button class="ok" data-act="tt-ok">OK</button></div>
      </div><div>${res}</div></div>
    ${ger.length ? '' : '<p class="small" style="opacity:.6">Dica: cadastre um gerente em Ajustes para que só ele possa sair deste modo.</p>'}</div>`;
}

function bindEvents() {

    if (userCap) { try { canAdmin = !!(await userCap.canEdit()); } catch (e) {} }
  } catch (e) { db = null; }
  if (!db) { mode = 'semacesso'; setSync('err', 'Sem conexão'); render(); return; }

}

  function repData(days){

    var byDay={},byCat={},byProd={},fat=0,cost=0,costCov=0,costAll=0;
    ords.forEach(function(o){var d=new Date(o.ts),k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');byDay[k]=(byDay[k]||0)+num(o.total);fat+=num(o.total);
      (o.items||[]).forEach(function(i){var p=byId(D.products,i.id),v=num(i.p)*num(i.q);var c=(p&&(p.t||[]).filter(function(t){return t!=='Cães'&&t!=='Gatos'})[0])||'Outros';byCat[c]=(byCat[c]||0)+v;
        var b=byProd[i.id]||(byProd[i.id]={id:i.id,n:i.n,q:0,v:0});b.q+=num(i.q);b.v+=v;costAll+=v;if(p&&num(p.cost)>0){cost+=num(p.cost)*num(i.q);costCov+=v}})});
    var aps=allAppts().filter(function(a){return apStatus(a)==='Concluído'&&new Date(a.day+'T12:00:00').getTime()>=since}),svcV=0,bySvc={};
    aps.forEach(function(a){svcV+=num(a.price);var n=String(a.svc).split(' + ')[0];bySvc[n]=(bySvc[n]||0)+1});
    return{ords:ords,byDay:byDay,byCat:byCat,byProd:byProd,fat:r2(fat),n:ords.length,ticket:ords.length?r2(fat/ords.length):0,lucro:costCov?r2(costCov-cost):null,cov:costAll?Math.round(costCov/costAll*100):0,svcV:r2(svcV),svcN:aps.length,bySvc:bySvc};
  }
  function buySuggest(){
    var since=Date.now()-30*864e5,sold={};
    allOrders().forEach(function(o){if(o.ts<since||ordStatus(o)==='Cancelado')return;(o.items||[]).forEach(function(i){sold[i.id]=(sold[i.id]||0)+num(i.q)})});
    var out=[];
    D.products.forEach(function(p){if(p.active===false)return;var q=sold[p.id]||0,st=stockOf(p),rate=q/30,cover=rate?Math.floor(st/rate):null,need=Math.ceil(rate*30)-st;
      if(st<=minStock(p)&&need<1)need=Math.max(1,minStock(p)+1-st);
      if(need>0)out.push({p:p,q:q,st:st,cover:cover,need:need,b:pMeta(p).b||'Outras marcas'})});
    return out.sort(function(a,b){return a.b.localeCompare(b.b)||(a.cover==null?999:a.cover)-(b.cover==null?999:b.cover)});
  }
  function priceIssues(){
    var out=[],VX=varIndex();
    Object.keys(VX.groups).forEach(function(k){var g=VX.groups[k],it=g.items;
      var pr=it.map(function(x){return priced(x.p).price}),allEq=pr.every(function(v){return v===pr[0]});
      if(allEq&&it.length>1){out.push({g:g,why:'Todos os tamanhos com o mesmo preço ('+brl(pr[0])+')',p:it[it.length-1].p});return}
      for(var i=1;i<it.length;i++){var a=it[i-1],b=it[i],pa=priced(a.p).price,pb=priced(b.p).price;
        if(pb<=pa)out.push({g:g,why:fmtQ(b)+' ('+brl(pb)+') custa igual ou menos que '+fmtQ(a)+' ('+brl(pa)+')',p:b.p});
        else if(pb/b.kg>pa/a.kg*1.2)out.push({g:g,why:fmtQ(b)+' sai mais caro por '+perLbl(b.u).slice(1)+' ('+brl(pb/b.kg)+') que '+fmtQ(a)+' ('+brl(pa/a.kg)+')',p:b.p});}
    });
    return out;

  function dropZone(el,onFiles,mark){
    if(!el)return;var n=0,m=mark||el;
    el.addEventListener('dragenter',function(e){if(!hasFiles(e))return;e.preventDefault();n++;m.classList.add('dropzone')});
    el.addEventListener('dragover',function(e){if(!hasFiles(e))return;e.preventDefault();e.dataTransfer.dropEffect='copy'});
    el.addEventListener('dragleave',function(){if(--n<=0){n=0;m.classList.remove('dropzone')}});
    el.addEventListener('drop',function(e){if(!hasFiles(e))return;e.preventDefault();e.stopPropagation();n=0;m.classList.remove('dropzone');var fs=[].slice.call(e.dataTransfer.files||[]).filter(isImg);if(fs.length)onFiles(fs);else toast('Arraste um arquivo de foto')});
  }

      if(row&&fs.length===1){photoToProduct(row.getAttribute('data-pid'),fs[0]);return}
      openPhotoBulk();photoItems(fs);renderPhotos();

  })();
  function resizeImage(file,max){
    return new Promise(function(res,rej){
      var img=new Image(),url=URL.createObjectURL(file);
      img.onload=function(){
        var r=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(img.width*r));c.height=Math.max(1,Math.round(img.height*r));
        var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function(b){b?res(b):rej(new Error('blob'))},'image/jpeg',0.85);
      };
      img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img'))};
      img.src=url;
    });
  }

  function aBanhoPainel(m){
    var today=todayStr(),t0=state.adm.gday||today,isToday=t0===today;
    var aps=allAppts().filter(function(a){var st=apStatus(a);if(st==='Cancelado'||st==='Faltou')return false;var stg=gStage(st);if(!stg)return false;if(a.day===t0)return true;return isToday&&(stg==='arr'||stg==='bath'||stg==='done')});

  async function setApptStatus(aid,day,slot,uid,next){
    var prev=D.status[aid]||{};
    var ap=allAppts().filter(function(x){return x.id===aid})[0];
    var st=Object.assign({},prev,{status:next,ts:Date.now()});
    st.note=prev.note||'';st.earnedPts=num(prev.earnedPts);st.earnedCash=num(prev.earnedCash);st.earnedBase=num(prev.earnedBase);
    try{
      if(next==='Concluído'&&ap&&uid&&!st.earnedPts&&!st.earnedCash){
        var e=earnFor(num(ap.price),wal(uid).life,((D.ficha||{})[uid]||{}).aniversario),fb=firstBuy(uid);
        if(e.pts>0||e.cash>0){await walletAdd(uid,{t:'compra',pago:num(ap.price),pts:e.pts,cash:e.cash,text:'Serviço: '+ap.svc});st.earnedPts=e.pts;st.earnedCash=e.cash;st.earnedBase=num(ap.price);if(fb)await appIndicacao(uid)}
      }else if(next!=='Concluído'&&(st.earnedPts>0||st.earnedCash>0)&&uid){
        await walletAdd(uid,{t:'compra',pago:-(st.earnedBase||0),pts:-st.earnedPts,cash:-st.earnedCash,text:'Serviço desfeito'});st.earnedPts=0;st.earnedCash=0;st.earnedBase=0;
      }
      D.status[aid]=st;
      await X.db.doc('status/'+aid).set(st);
      if(prev.status!==next&&uid){var am=apptNote(next,st,ap);if(am)notifyUser(uid,next==='Pronto para buscar'?(ap&&ap.pet?ap.pet:'Seu pet')+' está pronto!':next==='A caminho de casa'?'Saiu para entrega':next==='Aguardando'?'Recebemos seu pet':'Banho e tosa',am,'agenda')}
      if(next==='Cancelado'&&prev.status!=='Cancelado')await slotRelease(day,slot,aid);
      else if(prev.status==='Cancelado'&&next!=='Cancelado'){var rr=await slotReserve(day,slot,aid,ap&&ap.ts||Date.now());if(!rr)toast('Atenção: esse horário já está lotado')}
      toast('Agendamento atualizado');
    }catch(e){wfail(e)}
  }

  async function gUpload(file){
    if(!X.assets){toast('Envio de fotos indisponível neste acesso');return null}
    try{var blob=await resizeImage(file,1000);var r=await withRetry(function(){return X.assets.upload(blob,{type:'image/jpeg'})});return r.id}
    catch(e){toast(e&&e.code==='quota_or_state'?'Espaço de fotos esgotado':e&&e.code==='too_large'?'Foto muito grande':'Não foi possível enviar a foto');return null}

  function groomReport(ap,g){
    var pet=ap.pet||'seu pet',L=['🛁 *Relatório de banho e tosa — Gatecão*','',pet+(ap.kind?' ('+ap.kind+')':'')+(ap.day?' · '+fmtDay(ap.day):'')];
    var done=(g.done&&g.done.length)?g.done:(ap.svc?[ap.svc]:[]);
    if(done.length)L.push('','*Serviços realizados:*',done.map(function(s){return '• '+s}).join('\n'));
    if(g.chips&&g.chips.length)L.push('','*Como chegou:* '+g.chips.join(', '));
    if(g.cond)L.push(g.cond);
    if(g.arrivedWith||g.leftWith)L.push('',(g.arrivedWith?'*Chegou com:* '+g.arrivedWith:'')+(g.arrivedWith&&g.leftWith?'\n':'')+(g.leftWith?'*Saiu com:* '+g.leftWith:''));
    if(g.obs)L.push('',g.obs);
    L.push('','Obrigado por confiar no Gatecão! 🐾');
    return L.join('\n');
  }
  async function sendGroomReport(){
    var ap=GD.ap,g=GD.g,uid=GD.uid,txt=groomReport(ap,g);

  function bindGroom(){
    var ov=$('#overlay');

  function brandAdmin(){
    var box=$('#brandList');if(!box)return;
    var all=D.products.filter(function(p){return p.active!==false});
    var brands=topBrands(all,2),logos=D.settings.brandLogos||{},hide=D.settings.brandHide||{};
    Object.keys(logos).forEach(function(b){if(brands.indexOf(b)<0)brands.push(b)});
    if(!brands.length){box.innerHTML='<p class="hint">Nenhuma marca reconhecida ainda. As marcas vêm do nome dos produtos.</p>';return}
    box.innerHTML=brands.sort(function(a,b){return a.localeCompare(b,'pt-BR')}).map(function(b){
      return '<div class="bradm"><span class="lg">'+(logos[b]?'<img src="/_blob/'+esc(logos[b])+'" alt="">':'<span>sem logo</span>')+'</span><span><b>'+esc(b)+'</b>'+(hide[b]?' <span class="st off">Oculta</span>':'')+'</span><span style="display:flex;gap:6px">'+(X.assets?'<label class="mini" style="cursor:pointer">Logo<input type="file" accept="image/*" data-brlogo="'+esc(b)+'" hidden></label>':'')+(logos[b]?'<button class="mini" data-brrm="'+esc(b)+'">Tirar</button>':'')+'</span></div>';
    }).join('');
    async function saveSet(patch){var d=Object.assign({},D.settings,patch);try{await X.db.doc('settings/store').set(d);D.settings=d}catch(e){wfail(e)}}
    $$('[data-brlogo]',box).forEach(function(inp){inp.onchange=async function(){
      var f=inp.files&&inp.files[0];if(!f||!X.assets)return;if(!isImg(f)){toast('Esse arquivo não é uma imagem');return}

        var lg=Object.assign({},D.settings.brandLogos||{});lg[inp.getAttribute('data-brlogo')]=r.id;await saveSet({brandLogos:lg});toast('Logo enviada');brandAdmin();

      var lg=Object.assign({},D.settings.brandLogos||{});delete lg[bt.getAttribute('data-brrm')];await saveSet({brandLogos:lg});toast('Logo removida');brandAdmin();
    }});
  }

  var BK_COLS=['products','promos','tables','services','settings','slots','status','rewards','bonus','banners','coupons','reviews','orders','appts','customers','wallet','redeems','crm','inbox','campaigns','pdv_ficha','pdv_msgs','pdv_avulsas','pdv_fech','pdv_cfg'];
  function colOnce(name){return new Promise(function(res){var done=false,un=null,t=setTimeout(function(){if(!done){done=true;res([])}},12000);

  var TIERS_DEF=[{n:'Bronze',min:0,pct:2},{n:'Prata',min:500,pct:3},{n:'Ouro',min:1500,pct:5}];
  var RW_KIND={product:'Produto',service:'Serviço grátis',cash:'Cashback'};
  var RW_ICONS=[['gift','Presente'],['star','Estrela'],['bag','Saco de ração'],['bone','Osso ou petisco'],['drop','Banho'],['scissor','Tosa'],['ball','Brinquedo'],['bed','Cama'],['tag','Etiqueta']];
  function loy(){
    var t=S('tiers',null),L=(Array.isArray(t)&&t.length?t:TIERS_DEF).map(function(x){return{n:String(x.n||''),min:num(x.min),pct:num(x.pct)}});
    L.sort(function(a,b){return a.min-b.min});
    return{pts:num(S('ptsPerReal',1)),tiers:L};
  }
  function tierOf(life){var L=loy().tiers,cur=L[0];L.forEach(function(t){if(life>=t.min)cur=t});return cur}
  function nextTier(life){return loy().tiers.filter(function(t){return t.min>life})[0]||null}
  function wal(uid){var w=D.wallets[uid]||{};if(Array.isArray(w.mov)&&window.FID){var fs=FID.stats(w.mov,FID.conf(D.settings));return{points:fs.pts,cash:fs.saldo,life:fs.gasto12,log:FID.log(w.mov),vencendo:fs.vencendo,vencData:fs.vencData,gastoTot:fs.gastoTot,compras:fs.compras}}return{points:Math.max(0,Math.floor(num(w.points))),cash:r2(Math.max(0,num(w.cash))),life:Math.max(0,Math.floor(num(w.life))),log:w.log||[]}}

  function dayDiff(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5)}
  function fmtDM(d){return d?d.slice(8,10)+'/'+d.slice(5,7):''}
  function petDue(p){
    var t=todayStr();
    return PET_CARE.map(function(c){
      var last=p[c[0]];if(!last)return{k:c[0],l:c[1],g:c[3],none:true};
      var ev=Math.max(7,Math.round(num(p[c[0]+'E'])||c[2])),nx=addDays(last,ev);
      return{k:c[0],l:c[1],g:c[3],last:last,next:nx,d:dayDiff(t,nx)};
    });
  }
  function nextBday(bd){
    if(!bd||!/^\d{4}-\d\d-\d\d$/.test(bd))return null;
    var t=todayStr(),md=bd.slice(5)==='02-29'?'02-28':bd.slice(5),s1=t.slice(0,4)+'-'+md;
    if(s1<t)s1=(+t.slice(0,4)+1)+'-'+md;
    return{day:s1,d:dayDiff(t,s1),age:+s1.slice(0,4)-(+bd.slice(0,4))};
  }
  function petAge(bd){

  }

  /* ---------- ração: quanto tempo dura cada embalagem ---------- */
  function fmtD(d){return d?String(d).split('-').reverse().join('/'):''}
  function isDryFood(p){
    if(!p||(p.t||[]).indexOf('Rações')<0)return false;
    if(/(umid|úmid|sach|lata\b|pat[eê]\b|molho)/i.test(p.name||''))return false;
    var w=wParse(p.name);return !!w&&w.u==='kg'&&w.kg>=0.5;
  }
  function foodSp(p){var t=p.t||[];if(t.indexOf('Gatos')>-1&&t.indexOf('Cães')<0)return 'Gatos';if(t.indexOf('Cães')>-1&&t.indexOf('Gatos')<0)return 'Cães';return /\bgat|\bcat\b/.test(normTxt(p.name))?'Gatos':'Cães'}
  function petAgeM(bd){if(!bd)return null;var t=todayStr();return (+t.slice(0,4)-(+bd.slice(0,4)))*12+(+t.slice(5,7)-(+bd.slice(5,7)))}
  function defW(n){var t=normTxt(n);return /\b(mini|pequen|toy|small)/.test(t)?7:/\b(grande|gigante|large|maxi)/.test(t)?30:/\bmedi/.test(t)?15:12}
  // gramas por dia: necessidade de energia (70 x peso^0,75) x fator de atividade / energia da ração
  function gPerDay(sp,w,ageM){var g=(sp==='Gatos'?22:30)*Math.pow(Math.max(.5,w),.75);if(ageM!=null&&ageM<12)g*=1.5;else if(ageM!=null&&ageM>=96)g*=.9;return g}
  function feedPetsOf(me,sp){return ((me&&me.pets)||[]).filter(function(p){return p.k!=='Outro'&&((sp==='Gatos')===(p.k==='Gato'))})}
  function feedFormula(me,sp,name){
    var g=0;feedPetsOf(me,sp).forEach(function(p){g+=gPerDay(sp,num(p.w)||(sp==='Gatos'?4:defW(name)),petAgeM(p.bd))});
    if(!g)g=gPerDay(sp,sp==='Gatos'?4:defW(name),null);
    return g/1000;
  }
  function feedEst(me,obs,sp,name,kg){
    var f=feedFormula(me,sp,name),o=(obs||[]).filter(function(x){return x.sp===sp}).slice(-4).map(function(x){return x.kd}),k=f;
    if(o.length){var m=o.reduce(function(a,b){return a+b},0)/o.length;k=o.length>=2?m*.75+f*.25:(m+f)/2}
    return Math.max(5,Math.min(240,Math.round(kg/k)));
  }
  function myFeed(){return Object.assign({},load('gc_feed',{}),(D.me&&D.me.feed)||{})}
  function myObs(){return ((D.me&&D.me.feedObs)||load('gc_feedobs',[])).slice()}
  function feedActive(map){map=map||myFeed();return Object.keys(map).map(function(k){return map[k]}).filter(function(x){return x&&!x.done&&x.end}).sort(function(a,b){return a.end<b.end?-1:1})}
  async function feedSave(map,obs){
    if(X.db&&X.uid&&D.me){
      var data=Object.assign({},D.me,{feed:map,upd:Date.now()});if(obs)data.feedObs=obs.slice(-8);
      await X.db.doc('customers/'+X.uid).set(data);D.me=data;save('gc_feed',{});
    }else{save('gc_feed',map);if(obs)save('gc_feedobs',obs.slice(-8))}
  }
  function feedLearn(obs,x,real){var base=x.est||x.days;if(real>=3&&real>=base*.4&&real<=base*2.5)obs.push({sp:x.sp,kd:Math.round(x.kg/real*10000)/10000,ts:Date.now()})}
  // nova embalagem: fecha a anterior (e aprende quanto durou de verdade) ou entra na fila se a atual ainda tem ração
  function feedAdd(map,obs,me,e){
    var start=e.start||e.bought;
    Object.keys(map).forEach(function(k){
      var x=map[k];if(x.done||x.sp!==e.sp)return;
      if(!e.start&&x.bought===e.bought)return;
      if(e.start&&x.start>=e.start)return;
      if(!e.start){var left=dayDiff(e.bought,x.end);if(left>5){if(x.end>start)start=x.end;return}}
      var real=dayDiff(x.start,e.start||e.bought);x.done=true;x.real=real;feedLearn(obs,x,real);
    });
    var days=feedEst(me,obs,e.sp,e.n,e.kg),id='f'+Date.now()+Math.random().toString(36).slice(2,5);
    map[id]={id:id,pid:e.pid||'',n:e.n,kg:Math.round(e.kg*1000)/1000,sp:e.sp,bought:e.bought,start:start,days:days,est:days,end:addDays(start,days),src:e.src||'app'};
    var ks=Object.keys(map).sort(function(a,b){return String(map[b].bought).localeCompare(String(map[a].bought))});
    ks.slice(12).forEach(function(k){if(map[k].done)delete map[k]});
    return map[id];
  }
  async function feedFromOrder(o){
    var agg={};
    (o.items||[]).forEach(function(i){var p=byId(D.products,i.id);if(!isDryFood(p))return;var w=wParse(p.name),sp=foodSp(p),k=sp+'|'+p.id;agg[k]=agg[k]||{pid:p.id,n:p.name,kg:0,sp:sp,bought:todayStr(),src:'app'};agg[k].kg+=w.kg*(num(i.q)||1)});
    var ks=Object.keys(agg);if(!ks.length)return;
    var map=myFeed(),obs=myObs();ks.forEach(function(k){feedAdd(map,obs,D.me||{},agg[k])});
    await feedSave(map,obs);
  }

    else if(kind==='feedDel'){delete map[id];toast('Ração removida')}

  /* ---------- banho e tosa: quando voltar ---------- */
  function petKey(n){return String(n||'').trim().toLowerCase()}
  function bathIdeal(coat){return coat==='Curta'?Math.round(num(S('bathC',30))):coat==='Longa'?Math.round(num(S('bathL',15))):Math.round(num(S('bathM',21)))}
  function isTosa(svc){return String(svc||'').split(' + ').some(function(x){return /tosa/i.test(x)&&!/higi[eê]nica/i.test(x)})}
  function bathInfo(name,appts,po){
    var k=petKey(name),t=todayStr(),mine=(appts||[]).filter(function(a){return petKey(a.pet)===k});
    var past=mine.filter(function(a){var st=apStatus(a);return a.day<=t&&st!=='Cancelado'&&st!=='Faltou'}).sort(function(a,b){return a.day<b.day?1:-1});
    var fut=mine.filter(function(a){return a.day>=t&&apStatus(a)==='Agendado'}).sort(function(a,b){return a.day<b.day?-1:1})[0]||null;
    var lb=past[0]?past[0].day:'';if(po&&po.lb&&po.lb>lb)lb=po.lb;
    var pt=past.filter(function(a){return isTosa(a.svc)})[0],lt=pt?pt.day:'';if(po&&po.lt&&po.lt>lt)lt=po.lt;
    var coat=(po&&po.coat)||(past[0]&&past[0].coat)||(mine[0]&&mine[0].coat)||'';
    var ev=(po&&num(po.bE)>0)?Math.round(num(po.bE)):bathIdeal(coat);
    var te=(po&&po.tE!==undefined&&po.tE!=='')?Math.round(num(po.tE)):Math.round(num(S('tosaDays',45)));
    var r={coat:coat,ev:ev,te:te,last:lb,lastT:lt,fut:fut};
    if(lb){r.next=addDays(lb,ev);r.d=dayDiff(t,r.next);r.since=dayDiff(lb,t)}
    if(lt&&te>0){r.nextT=addDays(lt,te);r.dT=dayDiff(t,r.nextT);r.sinceT=dayDiff(lt,t)}
    return r;
  }
  function myPetsAll(){
    var out=[],seen={};
    ((D.me&&D.me.pets)||[]).forEach(function(p,i){var k=petKey(p.n);if(!k||seen[k])return;seen[k]=1;out.push({n:p.n,po:p,i:i})});
    state.myAppts.forEach(function(a){var k=petKey(a.pet);if(!k||seen[k])return;seen[k]=1;out.push({n:a.pet,po:null,i:-1})});
    return out;
  }

  var SEGS=[['todos','Todos'],['novos','Novos (30 dias)'],['fieis','Fiéis'],['inativos','Sem comprar há 30+ dias'],['optin','Aceitam ofertas']];
  var DAY=86400000;
  function statsMap(){
    var m={};
    function g(u){return m[u]||(m[u]={orders:0,appts:0,spent:0,last:0})}
    allOrders().forEach(function(o){if(ordStatus(o)==='Entregue'){var s=g(o.uid);s.orders++;s.spent+=num(o.total);s.last=Math.max(s.last,o.ts)}});
    allAppts().forEach(function(a){var st=apStatus(a);if(st==='Concluído'){var s=g(a.uid);s.appts++;s.spent+=num(a.price);s.last=Math.max(s.last,new Date(a.day+'T12:00:00').getTime())}});
    Object.keys(D.wallets||{}).forEach(function(u){(D.wallets[u].mov||[]).forEach(function(x){if(x.t==='compra'&&x.canal==='loja'&&num(x.pago)>0){var q=g(u);q.loja=(q.loja||0)+1;q.spent+=num(x.pago);q.last=Math.max(q.last,Date.parse(x.data)||0)}})});
    Object.keys(m).forEach(function(k){m[k].spent=r2(m[k].spent)});
    return m;
  }
  function sinceText(ts){if(!ts)return 'Ainda não comprou';var d=Math.floor((Date.now()-ts)/DAY);return d<=0?'Comprou hoje':d===1?'Comprou ontem':'Comprou há '+d+' dias'}

    var st=statsMap(),q=state.adm.cq.trim().toLowerCase(),seg=state.adm.cseg,L=loy().tiers,top=L[L.length-1],now=Date.now();
    var list=D.customers.filter(function(c){
      var s=st[c.id]||{last:0},w=wal(c.id);
      if(q&&((c.name||'')+' '+(c.phone||'')+' '+(c.pets||[]).map(function(p){return p.n}).join(' ')).toLowerCase().indexOf(q)<0)return false;
      if(seg==='novos')return now-num(c.ts)<=30*DAY;
      if(seg==='fieis')return w.life>=top.min&&top.min>0;
      if(seg==='inativos')return s.last>0&&now-s.last>30*DAY;
      if(seg==='optin')return !!c.optin;
      return true;
    });

    var parts=key.split('|'),uid=parts[0],rid=parts[1];
    var r=allRedeems().filter(function(x){return x.id===rid})[0];if(!r)return;
    try{
      if(!ok){await X.db.doc('status/'+rid).set({status:'Recusado',ts:Date.now()});notifyUser(uid,'Resgate não atendido','Não conseguimos atender o resgate de "'+r.name+'". Seus pontos não foram usados.','clube').catch(function(){});toast('Resgate recusado');return}
      var rw=byId(D.rewards,r.rid),w=wal(uid),st=rw?rwStock(rw):null;
      if(w.points<r.cost){toast('O cliente não tem mais pontos suficientes');return}
      if(st!==null&&st<=0){toast('Este prêmio está sem estoque');return}
      await walletAdd(uid,{t:'resgate',pts:-r.cost,text:'Resgate pelo app: '+r.name,premio:r.name,premioId:r.rid});
      if(rw&&rw.kind==='cash'&&num(rw.cashValue)>0)await walletAdd(uid,{cash:num(rw.cashValue),text:'Cashback do resgate: '+r.name});
      if(rw&&st!==null)await X.db.doc('rewards/'+rw.id).update({stock:Math.max(0,st-1)});

      await X.db.doc('status/'+rid).set({status:'Aprovado',cost:r.cost,ts:Date.now()});
      notifyUser(uid,'Resgate aprovado','Seu resgate de "'+r.name+'" foi aprovado.'+(rw&&rw.kind==='cash'?' O cashback já está no seu saldo.':' Retire ou agende na loja.'),'clube').catch(function(){});
      toast('Resgate aprovado');
    }catch(e){wfail(e)}

  function norm(s){return String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
  function slug(s){return norm(s).replace(/ /g,'')}
  function parseMoney(v){
    if(typeof v==='number')return isFinite(v)?v:0;
    var s=String(v==null?'':v).replace(/[^\d.,-]/g,'');
    if(!s)return 0;
    var c=s.lastIndexOf(','),d=s.lastIndexOf('.');
    if(c>-1&&d>-1){if(c>d)s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'')}
    else if(c>-1)s=s.replace(',','.');
    else if(d>-1&&/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
    var n=parseFloat(s);return isNaN(n)?0:n;
  }
  function parseCSV(text){
    var first=text.split(/\r?\n/,1)[0]||'',best=';',bc=-1;
    [';','\t',',','|'].forEach(function(d){var c=first.split(d).length;if(c>bc){bc=c;best=d}});
    var rows=[],row=[],cur='',q=false;
    function push(){row.push(cur);cur='';if(row.some(function(c){return String(c).trim()!==''}))rows.push(row);row=[]}
    for(var i=0;i<text.length;i++){
      var ch=text[i];
      if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
      else if(ch==='"')q=true;
      else if(ch===best){row.push(cur);cur=''}
      else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;push()}
      else cur+=ch;
    }
    if(cur!==''||row.length)push();
    return rows;
  }
  async function readTable(file){
    var buf=await file.arrayBuffer(),name=file.name.toLowerCase();
    if(/\.(xlsx|xls|xlsm|ods)$/.test(name)){
      if(!window.XLSX)throw new Error('xlsx');
      var wb=window.XLSX.read(buf,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];
      return window.XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''}).filter(function(r){return r.some(function(c){return String(c).trim()!==''})});
    }
    var txt;
    try{txt=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){txt=new TextDecoder('windows-1252').decode(buf)}
    return parseCSV(txt.replace(/^﻿/,''));
  }

  var IMP_FIELDS=[
    ['code','Código (EAN ou SKU)',['codigo de barras','codigo barras','cod barras','ean','gtin','sku','codigo','cod','referencia','ref']],
    ['name','Nome do produto',['nome do produto','descricao do produto','descricao produto','nome','descricao','produto','item']],
    ['price','Preço de venda',['preco de venda','preco venda','valor de venda','valor venda','preco unitario','valor unitario','preco','valor','venda','pvp']],
    ['stock','Estoque',['estoque atual','saldo estoque','estoque','quantidade','qtde','qtd','saldo']],
    ['cat','Categoria no seu sistema',['categoria','grupo','departamento','familia','secao','linha','subgrupo']],
    ['desc','Detalhe (peso, marca, unidade)',['complemento','detalhe','embalagem','peso','marca','fabricante','observacao','unidade']]
  ];
  function detectMap(header){
    var hs=header.map(norm),map={},used={};
    IMP_FIELDS.forEach(function(f){map[f[0]]=-1});
    [true,false].forEach(function(exact){
      IMP_FIELDS.forEach(function(f){
        if(map[f[0]]>-1)return;
        for(var s=0;s<f[2].length;s++){
          var syn=f[2][s];
          for(var i=0;i<hs.length;i++){
            if(used[i])continue;
            var ok=exact?hs[i]===syn:(syn.length>=4&&hs[i].indexOf(syn)>-1);
            if(ok){map[f[0]]=i;used[i]=1;return}
          }
        }
      });
    });
    return map;
  }
  function inferCats(cat,name){
    var t=norm(cat+' '+name),out=[];
    function has(re){return re.test(t)}
    if(has(/\bgat[oa]s?\b|felin|\bcat\b/))out.push('Gatos');
    if(has(/\bc[aã]o\b|\bcaes\b|cachorr|canin|\bdog\b/)||has(/\bcao\b/))out.push('Cães');
    var food=has(/racao|racoes|\bsache\b|\bwet\b|alimento umido|fresh meat|\bpate\b/),pulga=false;
    if(has(/biscoito|petisco|bifinho|\bosso\b|snack|cookie/)){out.push('Petiscos');food=false}
    if(has(/areia|tapete|granulado sanitario/)){out.push('Higiene');if(!has(/combo/))food=false}
    if(food)out.push('Rações');
    if(has(/endogard|vermifug/))out.push('Farmácia');
    else if(has(/antipulga|carrapato|nexgard|simparic|frontline|capstar|seresto|ectofend|leevre|vaponex|wellpet|antiparasitari|bravecto|credeli|revolution|advocate/)){out.push('Antipulgas');pulga=true}
    else if(!food&&has(/comprimid|capsula|\bcmp\b|\d\s?mg\b|suplement|probiotic|antibiot|anti-?inflamat|antimicrob|antibacter|otolog|auricular|orelha|ocular|homeopat|antiemet|ograx|condroplex|apoquel|predniso|vitamin|\bflora\b|omega/))out.push('Farmácia');
    if(has(/shampoo|condicionador|sabonete|perfume|colonia|escova|cortador/)&&out.indexOf('Higiene')<0)out.push('Higiene');
    if(has(/brinquedo|bolinha|\bbola\b|mordedor|arranhador|pelucia/))out.push('Brinquedos');
    if(!pulga&&has(/coleira|\bcama\b|comedouro|bebedouro|\bguia\b|peitoral|roupa|caixa de transporte|casinha|\bfonte\b/))out.push('Acessórios');
    return out;
  }
  function inferIcon(cats){
    var m={'Rações':'bag','Petiscos':'bone','Antipulgas':'shield','Farmácia':'pill','Higiene':'drop','Brinquedos':'ball','Acessórios':'tag','Gatos':'cat'};
    var order=['Rações','Petiscos','Antipulgas','Farmácia','Higiene','Brinquedos','Acessórios','Gatos'];
    for(var i=0;i<order.length;i++)if(cats.indexOf(order[i])>-1)return m[order[i]];
    return 'paw';
  }

  function openImport(){
    state.imp={step:1,rows:null,map:null,fileName:'',opts:{upPrice:true,upStock:true,create:true,hideNew:true},result:null,busy:false,prog:0,total:0};

  function impColName(i){var h=state.imp.rows[0];return h&&h[i]!=null&&String(h[i]).trim()!==''?String(h[i]).trim():'Coluna '+(i+1)}
  function buildPlan(){
    var I=state.imp,M=I.map,plan={create:[],update:[],errors:[]},byCode={},byName={},seen={};
    D.products.forEach(function(p){if(p.code)byCode[slug(p.code)]=p;byName[norm(p.name)]=p});
    I.rows.slice(1).forEach(function(r,ix){
      function g(f){return M[f]>=0&&r[M[f]]!=null?String(r[M[f]]).trim():''}
      var line=ix+2,name=g('name'),code=g('code'),price=parseMoney(g('price'));
      var ex=(code&&byCode[slug(code)])||(name&&byName[norm(name)])||null;
      if(!name&&!ex){plan.errors.push({line:line,msg:'sem nome'});return}
      if(!ex&&!(price>0)){plan.errors.push({line:line,msg:'sem preço',name:name});return}
      var key=ex?ex.id:(code?'c'+slug(code):'n'+norm(name));
      if(seen[key]){plan.errors.push({line:line,msg:'repetido na planilha',name:name});return}
      seen[key]=1;
      var rec={line:line,name:name,code:code,price:price,stock:M.stock>=0&&g('stock')!==''?Math.max(0,Math.round(parseMoney(g('stock')))):null,cat:g('cat'),desc:g('desc')};
      if(ex)plan.update.push({p:ex,rec:rec});else plan.create.push({rec:rec});
    });
    return plan;
  }

      if(R.failed)h+='<p class="hint">Alguns produtos não foram salvos. Importe a mesma planilha de novo: o que já entrou será apenas atualizado.</p>';
      if(R.created&&I.opts.hideNew)h+='<p class="hint">Os produtos novos estão ocultos. Depois de colocar as fotos, mostre-os no app pelo filtro Ocultos.</p>';

  async function withRetry(fn){
    for(var i=0;i<4;i++){
      try{return await fn()}catch(e){
        if(e&&(e.code==='resource_exhausted'||e.code==='unavailable')&&i<3){await new Promise(function(r){setTimeout(r,700*(i+1))});continue}
        throw e;
      }
    }
  }
  async function runPool(tasks,n,onTick){
    var i=0,done=0;
    async function worker(){while(i<tasks.length){var t=tasks[i++];try{await t()}catch(e){}done++;if(onTick)onTick(done)}}
    var ws=[];for(var k=0;k<n;k++)ws.push(worker());
    await Promise.all(ws);
  }
  async function runImport(plan){
    var I=state.imp,R={created:0,updated:0,failed:0},tasks=[];
    if(I.opts.create)plan.create.forEach(function(x){
      tasks.push(async function(){
        var r=x.rec,cats=inferCats(r.cat,r.name);
        var data={name:r.name.slice(0,120),desc:(r.desc||'').slice(0,120),t:cats,price:r2(r.price),stock:r.stock==null?0:r.stock,minStock:3,badge:'',i:inferIcon(cats),img:'',code:r.code,active:!I.opts.hideNew,tp:{}};
        try{await withRetry(function(){return X.db.collection('products').doc().set(data)});R.created++}catch(e){R.failed++}
      });
    });
    plan.update.forEach(function(x){
      var patch={};
      if(I.opts.upPrice&&x.rec.price>0)patch.price=r2(x.rec.price);
      if(I.opts.upStock&&x.rec.stock!=null)patch.stock=x.rec.stock;
      if(!x.p.code&&x.rec.code)patch.code=x.rec.code;
      if(!Object.keys(patch).length)return;
      tasks.push(async function(){try{await withRetry(function(){return X.db.doc('products/'+x.p.id).update(patch)});R.updated++}catch(e){R.failed++}});
    });
    I.step=3;I.busy=true;I.prog=0;I.total=tasks.length;I.result=R;renderImport();
    var last=0;
    await runPool(tasks,4,function(n){I.prog=n;var b=$('#overlay .prog i');if(b)b.style.width=Math.round(n/Math.max(1,I.total)*100)+'%';last=n});
    I.busy=false;renderImport();
  }

  function pCodeKey(c){var s=slug(c);return /^\d+$/.test(s)?s.replace(/^0+/,''):s}
  function matchPhotoName(fileName){
    var base=fileName.replace(/\.[^.]+$/,''),cands=[base],m=base.match(/^(.*?)[\s_\-]+\(?(\d{1,2})\)?$/);
    var order=0;
    if(m&&m[1]){cands.push(m[1]);order=+m[2]}
    var byCode={},byName={},list=D.products;
    list.forEach(function(p){if(p.code)byCode[pCodeKey(p.code)]=p;byName[slug(p.name)]=p});
    for(var i=0;i<cands.length;i++){
      var ck=pCodeKey(cands[i]),sk=slug(cands[i]);
      if(ck&&byCode[ck])return{p:byCode[ck],order:i===1?order:1};
      if(sk&&byName[sk])return{p:byName[sk],order:i===1?order:1};
    }
    for(var j=0;j<cands.length;j++){
      var s=slug(cands[j]);if(s.length<6)continue;
      var hits=list.filter(function(p){var n=slug(p.name);return n.indexOf(s)>-1||(n.length>=6&&s.indexOf(n)>-1)});
      if(hits.length===1)return{p:hits[0],order:j===1?order:1};
    }
    return null;
  }

  function photoItems(files){

    var items=Array.prototype.slice.call(files).filter(function(f){return /^image\//.test(f.type)||/\.(jpe?g|png|webp|gif|heic)$/i.test(f.name)}).map(function(f){
      var mt=matchPhotoName(f.name);
      return{file:f,pid:mt?mt.p.id:'',order:mt?mt.order:0,thumb:URL.createObjectURL(f)};
    });
    items.forEach(function(it){if(!it.pid)return;var b=best[it.pid];if(!b||(it.order||99)<(b.order||99))best[it.pid]=it});
    items.forEach(function(it){if(it.pid&&best[it.pid]!==it)it.pid='';it.extra=false});
    P.items=items;

  async function runPhotos(){
    var P=state.pho,res={ok:0,fail:0,skip:0,quota:false},tasks=[];
    var todo=P.items.filter(function(i){return i.pid});
    P.items.forEach(function(i){if(!i.pid)res.skip++});
    todo.forEach(function(it){
      tasks.push(async function(){
        if(res.quota){res.skip++;return}
        var p=byId(D.products,it.pid);
        if(!p||(p.img&&!P.replace)){res.skip++;return}
        try{
          var blob=await resizeImage(it.file,800);
          var r=await withRetry(function(){return X.assets.upload(blob,{type:'image/jpeg'})});
          var old=p.img;
          await withRetry(function(){return X.db.doc('products/'+p.id).update({img:r.id})});
          p.img=r.id;res.ok++;
          if(old&&old!==r.id&&!D.products.some(function(q){return q.id!==p.id&&q.img===old})&&!D.rewards.some(function(w){return w.img===old})){X.assets.delete(old).catch(function(){})}
        }catch(e){if(e&&e.code==='quota_or_state')res.quota=true;res.fail++}
      });
    });
    P.busy=true;P.prog=0;P.total=tasks.length;renderPhotos();
    await runPool(tasks,3,function(n){P.prog=n;var b=$('#overlay .prog i');if(b)b.style.width=Math.round(n/Math.max(1,P.total)*100)+'%'});
    P.busy=false;P.res=res;P.items.forEach(function(i){try{URL.revokeObjectURL(i.thumb)}catch(e){}});renderPhotos();
  }
